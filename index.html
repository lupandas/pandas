                      html += '<tr>' + ['序号', '名称', '单位', '数量', '综合单价', '合计', '规格材质', '备注'].map(h => '<td style="border:1px solid #e6dcd0;padding:5px;font-weight:bold;background:#faf7f2;">' + h + '</td>').join('') + '</tr>';
                      rows.forEach((r, i) => {
                          const qty = Number(r.quantity) || 0, pr = Number(r.price) || 0;
                          const cells = [i + 1, r.name || '', r.unit || '', qty, pr, Math.round(qty * pr * 100) / 100, r.spec || '', r.remark || ''];
                          html += '<tr>' + cells.map(c => '<td style="border:1px solid #e6dcd0;padding:5px;">' + (c == null ? '' : c) + '</td>').join('') + '</tr>';
                      });
                      html += '<tr><td colspan="5" style="border:1px solid #e6dcd0;padding:5px;text-align:right;font-weight:bold;">小计</td><td colspan="3" style="border:1px solid #e6dcd0;padding:5px;">' + Math.round(rows.reduce((s, r) => s + (Number(r.quantity) || 0) * (Number(r.price) || 0), 0) * 100) / 100 + '</td></tr>';
                  });
                  html += '<tr><td colspan="5" style="border:1px solid #e6dcd0;padding:6px;text-align:right;font-weight:bold;">总合计</td><td colspan="3" style="border:1px solid #e6dcd0;padding:6px;font-weight:bold;">' + total + '</td></tr>';
                  html += '</table>';
                  node.innerHTML = html;
                  node.style.position = 'fixed'; node.style.left = '-99999px'; node.style.top = '0'; node.style.zIndex = '-1';
                  document.body.appendChild(node);
                  try {
                      const canvas = await html2canvas(node, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                      const pdf = new jsPDF('p', 'mm', 'a4');
                      const pageW = 210, pageH = 297, imgW = pageW - 20;
                      const imgH = canvas.height * imgW / canvas.width;
                      let printed = 0, firstPage = true;
                      while (printed < imgH) {
                          if (!firstPage) pdf.addPage();
                          firstPage = false;
                          const sliceH = Math.min(pageH - 20, imgH - printed);
                          const srcY = canvas.height * (printed / imgH);
                          const sliceSrcH = canvas.height * (sliceH / imgH);
                          pdf.addImage(canvas, 'PNG', 10, 10, imgW, sliceH, undefined, 'FAST', 0, srcY, sliceSrcH);
                          printed += sliceH;
                      }
                      const buf = pdf.output('arraybuffer');
                      return new Blob([buf], { type: 'application/pdf' });
                  } finally { document.body.removeChild(node); }
              };
              try {
                  const xlsxBlob = await createExcel();
                  const xlsxName = base + '_报价清单_' + stamp + '.xlsx';
                  triggerDownload(xlsxBlob, xlsxName);
                  try {
                      const pdfBlob = await createPdf();
                      if (pdfBlob) {
                          const pdfName = base + '_报价清单_' + stamp + '.pdf';
                          triggerDownload(pdfBlob, pdfName);
                      }
                  } catch (e2) { console.error('PDF 生成失败', e2); if (window.__showToast) window.__showToast('⚠️ Excel 已导出，PDF 生成失败：' + e2.message); }
                  if (window.__showToast) window.__showToast(hasRows ? '✅ 已导出报价 Excel/PDF 到本地（已下载到电脑）' : '✅ 已导出（当前报价无条目，为基础表头示例）Excel/PDF');
              } catch (e) { console.error(e); if (window.__showToast) window.__showToast('❌ 导出到缓存失败：' + e.message); }
          };

          const handleExportData = () => {
              const dataStr = JSON.stringify(data, null, 2);
              const blob = new Blob([dataStr], { type: "application/json" });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = `pandas_data_export_${new Date().getTime()}.json`;
              document.body.appendChild(a);
              a.click();
              URL.revokeObjectURL(url);
              document.body.removeChild(a);
              if (window.__showToast) window.__showToast("✅ 数据导出成功！");
          };

          const handleImportData = (e) => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (event) => {
                  try {
                      const importedData = JSON.parse(event.target.result);
                      if (importedData && importedData.logos && importedData.menus) {
                          setDialog({
                              type: 'importChoice',
                              msg: '检测到有效的数据配置文件，请选择您的导入方式：\n\n【合并导入】：只添加文件中新增的数据(如新的作品/图文等)，不会删除您当前页面已有的数据。\n【覆盖导入】：彻底清空当前页面数据，完全替换为文件中的数据。',
                              onMerge: () => {
                                  setData(p => {
                                      let merged = { ...p };
                                      // 工具函数：根据 ID 智能合并数组，不覆盖已存在的同 ID 项
                                      const mergeArrayUnique = (arr1 = [], arr2 = []) => {
                                          const existingIds = new Set(arr1.map(item => item.id));
                                          const newItems = arr2.filter(item => !existingIds.has(item.id));
                                          return [...arr1, ...newItems];
                                      };
                                      
                                      for (let key in importedData) {
                                          if (Array.isArray(importedData[key])) {
                                              merged[key] = mergeArrayUnique(p[key] || [], importedData[key]);
                                          } else if (typeof importedData[key] === 'object' && importedData[key] !== null) {
                                              if (key === 'contactData' && importedData.contactData.items) {
                                                  merged.contactData = {
                                                      ...importedData.contactData,
                                                      ...(p.contactData || {}),
                                                      items: mergeArrayUnique(p.contactData?.items || [], importedData.contactData.items)
                                                  };
                                              } else {
                                                  // 对于对象（如 logos, uiTexts 等），保留当前已有字段，只新增缺失字段
                                                  merged[key] = { ...importedData[key], ...(p[key] || {}) };
                                              }
                                          } else {
                                              merged[key] = p[key] !== undefined ? p[key] : importedData[key];
                                          }
                                      }
                                      return merged;
                                  });
                                  setDialog(null);
                                  if (window.__showToast) window.__showToast("✅ 数据合并成功！已添加新增内容。");
                              },
                              onReplace: () => {
                                  setData(importedData);
                                  setDialog(null);
                                  if (window.__showToast) window.__showToast("✅ 数据已完全替换覆盖！");
                              }
                          });
                      } else {
                          throw new Error("Invalid format");
                      }
                  } catch (err) {
                      setDialog({ type: 'alert', msg: '❌ 数据格式错误，导入失败。' });
                  }
              };
              reader.readAsText(file);
              e.target.value = '';
          };

          const executeSearch = (q) => {
              q = q.trim().toLowerCase();
              if(!q) return;
              let results = [];
              
              const collections = [
                  { id: 'gallery', label: '图片集' },
                  { id: 'videos', label: '视频' },
                  { id: 'projects', label: '作品案例' },
                  { id: 'cloudtext', label: '云端文本' },
                  { id: 'materials', label: '材料图集' },
                  { id: 'built', label: '落地案例' },
                  { id: 'plants', label: '植物图集' },
                  { id: 'team', label: '团队成员' }
              ];

              if (data.processTabs) {
                  data.processTabs.forEach(tab => {
                      collections.push({ id: tab.id, label: tab.label });
                  });
              }

              collections.forEach(col => {
                  const arr = data[col.id] || [];
                  arr.forEach(item => {
                      const matchTitle = (item.title||'').toLowerCase().includes(q) || (item.titleEn||'').toLowerCase().includes(q);
                      const matchDesc = (item.desc||'').toLowerCase().includes(q) || (item.descEn||'').toLowerCase().includes(q);
                      const matchCat = (item.category||'').toLowerCase().includes(q) || (item.categoryEn||'').toLowerCase().includes(q);
                      let matchContent = false;
                      (item.media || []).forEach(m => {
                          if (m.type === 'text' && (m.content||'').toLowerCase().includes(q)) matchContent = true;
                      });
                      if(matchTitle || matchDesc || matchCat || matchContent) {
                          const colLabel = currentLang === 'en' ? (data.menus?.find(m=>m.id===col.id)?.labelEn || col.label) : col.label;
                          results.push({...item, dataType: col.id, dataLabel: colLabel});
                      }
                  });
              });
              // 追加：AI 生图提示词 / AI 板块检索（归入"AI 提示词"分组）
              const aiHit = (s) => (s || '').toLowerCase().includes(q);
              (data.aiSiteImages || []).forEach((im, idx) => {
                  if (im && (aiHit(im.prompt) || aiHit(im.url))) {
                      results.push({ id: 'ai_' + idx, title: 'AI 提示词', titleEn: 'AI Prompt', desc: truncate(im.prompt || (im.url || '').slice(0, 80), 90), img: im.url, dataType: 'aiPrompt', dataLabel: currentLang === 'en' ? 'AI Prompts' : 'AI 提示词', category: 'AI' });
                  }
              });
              const aitext = data.aiSiteConfig && data.aiSiteConfig.siteText;
              if (aitext) {
                  const tSrc = currentLang === 'en' ? (aitext.titleEn || aitext.title) : aitext.title;
                  const dSrc = currentLang === 'en' ? (aitext.descEn || aitext.desc) : aitext.desc;
                  if (aiHit(tSrc) || aiHit(dSrc)) {
                      results.push({ id: 'ai_page', title: 'AI 生图工作台', titleEn: 'AI Studio', desc: truncate(dSrc || '', 90), img: (data.aiSiteImages && data.aiSiteImages[0] && data.aiSiteImages[0].url) || '', dataType: 'aiPrompt', dataLabel: currentLang === 'en' ? 'AI Prompts' : 'AI 提示词', category: 'AI' });
                  }
              }
              setSearchResults(results);
              setSearchQuery(q);
              setAiAnswer(null);
              setAiSuggestions(buildSearchSuggestions(q, results));
              askAiAnswer(q, results);
              navigateTo('search');
          };

          // ===== AI 智能回答：优先复用站内 aiSiteConfig 网关，失败自动降级本地规则推荐 =====
          const hlText = (text, q) => {
              if (!q || !q.trim()) return (text || '');
              const str = (text || '') + '';
              const ql = q.trim();
              if (!str.toLowerCase().includes(ql.toLowerCase())) return str;
              const esc = ql.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const parts = str.split(new RegExp('(' + esc + ')', 'ig'));
              return parts.map((seg, i) => (seg.toLowerCase() === ql.toLowerCase())
                  ? <mark key={i} className="bg-amber-200/70 text-inherit px-0.5 rounded-sm">{seg}</mark>
                  : seg);
          };
          const truncate = (s, n) => { const t = (s || '').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
          const getAiChatConfig = () => {
              const cfg = (data && data.aiSiteConfig) || {};
              const pick = (keys, url, extra) => {
                  if (!url || !keys || !keys.length) return null;
                  let extraParams = {};
                  try { extraParams = extra ? JSON.parse(extra) : {}; } catch (e) { extraParams = {}; }
                  if (!extraParams || typeof extraParams !== 'object') extraParams = {};
                  let model = (extraParams && extraParams.model) || '';
                  return { apiKey: keys[0], baseUrl: String(url).replace(/\/+$/, ''), extraParams, model };
              };
              // 优先级：chat 独立配置(enable) > global 网关（AGI 生图工作台同源）
              if (cfg.chat && cfg.chat.enable) {
                  const c = pick(cfg.chat.keys, cfg.chat.url, cfg.chat.extra);
                  if (c) return { ...c, provider: 'chat' };
              }
              const g = pick(cfg.global && cfg.global.keys, cfg.global && cfg.global.url, cfg.global && cfg.global.extra);
              if (g) return { ...g, provider: 'global' };
              return null;
          };
          // AI 对话通用大模型 fallback：主配置（chat/global）请求失败（HTTP 401/403/429/5xx/网络异常）或回答为空时自动切换到这里
          const getAiFallbackConfig = () => {
              const fb = (((data && data.aiSiteConfig) || {}).fallback) || {};
              const baseUrl = String(fb.baseUrl || '').trim();
              const apiKey = String(fb.apiKey || '').trim();
              if (!baseUrl || !apiKey) return null;
              let extraParams = {};
              try { extraParams = fb.extra ? JSON.parse(fb.extra) : {}; } catch (e) { extraParams = {}; }
              if (!extraParams || typeof extraParams !== 'object') extraParams = {};
              const model = String(fb.model || '').trim() || extraParams.model || '';
              return { apiKey, baseUrl: baseUrl.replace(/\/+$/, ''), extraParams, model, provider: 'fallback' };
          };
          // AI 助手外观/文案配置：优先读 aiSiteConfig.assistant，未配置用默认值兜底（不抛错）
          const getAssistantConfig = () => {
              const a = (data && data.aiSiteConfig && data.aiSiteConfig.assistant) || {};
              return {
                  name: a.name || 'AI 对话助手',
                  nameEn: a.nameEn || 'AI Chat Assistant',
                  iconUrl: a.iconUrl || '',
                  iconSize: (Number(a.iconSize) > 0) ? Number(a.iconSize) : 36,
                  greeting: a.greeting || '你好，我是你的 AI 对话助手。',
                  greetingEn: a.greetingEn || 'Hi, I am your AI assistant.',
                  subtitle: a.subtitle || '多轮问答 · 图文回答 · 联网搜索',
                  subtitleEn: a.subtitleEn || 'Multi-turn · Rich text · Web search',
                  themeColor: a.themeColor || '#2f6bff',
                  nameSize: (Number(a.nameSize) > 0) ? Number(a.nameSize) : 16,
                  subtitleSize: (Number(a.subtitleSize) > 0) ? Number(a.subtitleSize) : 10,
                  greetingSize: (Number(a.greetingSize) > 0) ? Number(a.greetingSize) : 14,
                  msgSize: (Number(a.msgSize) > 0) ? Number(a.msgSize) : 13,
                  titleWeight: a.titleWeight || 600,
                  greetingWeight: a.greetingWeight || 400,
                  titleFont: a.titleFont || '',
                  subtitleFont: a.subtitleFont || '',
                  greetingFont: a.greetingFont || ''
              };
          };
          const buildSearchSuggestions = (q, results) => {
              // 有命中优先用命中项；无命中时回退到全站标题/类别挖掘相关词
              const feed = (results && results.length)
                  ? results
                  : (() => {
                      const out = [];
                      (data.menus || []).forEach(m => { if (m.label || m.labelEn) out.push(m); });
                      ['gallery', 'videos', 'projects', 'cloudtext', 'materials', 'built', 'plants', 'team', 'aiSiteImages'].forEach(k => {
                          ((data[k] || [])).slice(0, 40).forEach(it => out.push(it));
                      });
                      return out;
                  })();
              const words = new Set();
              feed.slice(0, 40).forEach(item => {
                  const src = [item.title, item.titleEn, item.category, item.categoryEn, item.dataLabel, item.label, item.labelEn].filter(Boolean);
                  src.forEach(t => {
                      String(t).split(/[\s,，。、/;；:：[\]（）()]+/).forEach(w => {
                          w = w.trim();
                          if (w && w.length >= 2) words.add(w);
                      });
                  });
              });
              let suggest = Array.from(words)
                  .filter(w => w.toLowerCase().includes(q.toLowerCase()) || q.toLowerCase().includes(w.toLowerCase()))
                  .slice(0, 6);
              if (suggest.length < 3) {
                  const cats = feed.slice(0, 12).map(i => i.category || i.categoryEn || i.dataLabel || i.label).filter(Boolean);
                  suggest = Array.from(new Set([...suggest, ...cats])).slice(0, 6);
              }
              return suggest.filter(Boolean).slice(0, 6);
          };
          const buildLocalAnswer = (q, results) => {
              if (!results || !results.length) return null;
              const top = results.slice(0, 5);
              const lines = top.map((item, i) => {
                  const t = currentLang === 'en' ? (item.titleEn || item.title) : item.title;
                  const d = currentLang === 'en' ? (item.descEn || item.desc) : item.desc;
                  const cat = item.category && (currentLang === 'en' ? (item.categoryEn || item.category) : item.category);
                  return (cat ? cat + ' · ' : '') + t + (d ? '：' + truncate(d, 42) : '');
              });
              const intro = currentLang === 'en'
                  ? 'Here is a concise summary of the site content related to "' + q + '":'
                  : '根据站内内容，与“' + q + '”相关的摘要建议如下：';
              return { text: intro + '\n\n' + lines.map((l, i) => (i + 1) + '. ' + l).join('\n'), source: 'local' };
          };
          const askAiAnswer = async (q, results) => {
              if (!q) return;
              setAiAnswerLoading(true);
              const config = getAiChatConfig();
              let done = false;
              if (config && config.apiKey && config.baseUrl) {
                  try {
                      const systemMsg = currentLang === 'en'
                          ? 'You are the AI assistant of a landscape design portfolio website. Given the user query and matched site entries, reply with one concise helpful summary answer (like a search engine AI overview) in the same language as the query, 60-140 words, based only on the provided entries. Do not mention "matched entries".'
                          : '你是该景观设计作品集网站的智能助手。请根据用户搜索的关键词和下方匹配到的站点内容条目，生成一段简洁、有用的“摘要建议答案”（类似搜索引擎的 AI 智能回答），中文作答，60-140 字，仅依据提供的站点条目，不要提及“匹配条目”等字样。';
                      const ctx = (results || []).slice(0, 8).map((it, idx) => {
                          const t = it.titleEn || it.title || '';
                          const d = it.descEn || it.desc || '';
                          const c = it.categoryEn || it.category || it.dataLabel || '';
                          return (idx + 1) + '. [' + c + '] ' + t + ' - ' + truncate(d, 120);
                      }).join('\n');
                      const payload = {
                          model: config.model || 'agnes-2.5-flash',
                          messages: [
                              { role: 'system', content: systemMsg },
                              { role: 'user', content: 'Query: ' + q + '\n\nMatched site entries:\n' + ctx }
                          ],
                          temperature: 0.6,
                          stream: false
                      };
                      Object.assign(payload, config.extraParams);
                      // 主配置失败/空回答 → 自动切换到通用大模型 fallback 重试，仍失败才走本地降级
                      const tryReq = async (cfgForReq) => {
                          const p2 = Object.assign({}, payload, cfgForReq.extraParams || {}, { model: (cfgForReq.model || payload.model || 'agnes-2.5-flash') });
                          const res = await fetch(cfgForReq.baseUrl + '/chat/completions', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfgForReq.apiKey },
                              body: JSON.stringify(p2)
                          });
                          if (!res.ok) return null;
                          const j = await res.json();
                          const t = (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
                          return (t && t.trim()) ? { text: t.trim(), provider: cfgForReq.provider } : null;
                      };
                      const fbConfig = getAiFallbackConfig();
                      let ans = await tryReq(config);
                      if (!ans && fbConfig) ans = await tryReq(fbConfig);
                      if (ans) { setAiAnswer({ text: ans.text, source: 'api', provider: ans.provider }); done = true; }
                  } catch (e) { /* 网关不可用 → 自动降级本地规则推荐 */ }
              }
              if (!done) setAiAnswer(buildLocalAnswer(q, results));
              setAiAnswerLoading(false);
          };

          // ===================== 类豆包 AI 对话助手 =====================
          // --- 联网搜索：清晰可替换配置位。站内无内置搜索接口时如实降级说明 ---
          const WEB_SEARCH_CONFIG = {
              enabled: false,     // 置为 true 后启用真实联网检索（等待搜索服务接入）
              kind: 'http-json',  // 'http-json' | 'duckduckgo' | 'serper'
              endpoint: '',       // http-json 时必填：GET ?q= 返回 items/results/data 数组；serper/duckduckgo 采用内置地址
              apiKey: '',         // 搜索服务鉴权 Key（serper 走 X-API-KEY / http-json 走 Bearer）
              maxResults: 4
          };
          // web_search 工具定义（OpenAI 兼容 Function Calling）
          const WEB_SEARCH_TOOL_DEF = {
              type: 'function',
              function: {
                  name: 'web_search',
                  description: 'Search the web for real-time or external information to support the answer.',
                  parameters: {
                      type: 'object',
                      properties: { query: { type: 'string', description: 'search keywords' } },
                      required: ['query']
                  }
              }
          };
          // 搜索执行器：按 kind 分发，返回 { ok, results, reason }
          const executeWebSearch = async (q) => {
              const cfg = WEB_SEARCH_CONFIG;
              if (!cfg || !cfg.enabled) return { ok: false, results: [], reason: 'disabled' };
              try {
                  let items = [];
                  if (cfg.kind === 'serper') {
                      const res = await fetch('https://google.serper.dev/search', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json', 'X-API-KEY': cfg.apiKey || '' },
                          body: JSON.stringify({ q: String(q), num: cfg.maxResults || 4 })
                      });
                      if (!res.ok) return { ok: false, results: [], reason: 'http' };
                      const j = await res.json();
                      items = (j && j.organic) || [];
                  } else if (cfg.kind === 'duckduckgo') {
                      const res = await fetch('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(String(q)));
                      if (!res.ok) return { ok: false, results: [], reason: 'http' };
                      const html = await res.text();
                      const re = /<a[^>]+class="result__a"[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
                      let m = null;
                      while ((m = re.exec(html)) !== null && items.length < (cfg.maxResults || 4)) {
                          const raw = m[2].replace(/<[^>]+>/g, '').trim();
                          if (raw) items.push({ title: raw, url: m[1], snippet: '' });
                      }
                  } else { // http-json
                      if (!cfg.endpoint) return { ok: false, results: [], reason: 'no-endpoint' };
                      const sep = cfg.endpoint.indexOf('?') >= 0 ? '&' : '?';
                      const url = cfg.endpoint + sep + 'q=' + encodeURIComponent(String(q)) + '&limit=' + (cfg.maxResults || 4);
                      const res = await fetch(url, { headers: cfg.apiKey ? { 'Authorization': 'Bearer ' + cfg.apiKey } : {} });
                      if (!res.ok) return { ok: false, results: [], reason: 'http' };
                      const j = await res.json();
                      items = (j && (j.items || j.results || j.data)) || [];
                  }
                  const results = (items || []).slice(0, cfg.maxResults || 4).map(it => {
                      const imgSrc = it.image || it.thumbnail || it.imageUrl || it.thumb || it.pagemap?.cse_thumbnail?.[0]?.src || '';
                      return {
                          title: it.title || it.name || '',
                          url: it.url || it.link || '',
                          snippet: it.summary || it.snippet || it.desc || '',
                          image: imgSrc,
                          thumbnail: imgSrc
                      };
                  }).filter(it => it.title || it.url);
                  return { ok: true, results };
              } catch (e) {
                  return { ok: false, results: [], reason: 'error' };
              }
          };
          // 兼容旧调用：返回结果数组或 null
          const chatWebSearch = async (q) => {
              const r = await executeWebSearch(q);
              return r.ok ? r.results : null;
          };

          // --- 生图：优先 aiSiteConfig.image，否则复用 global 网关 OpenAI 兼容 /images/generations 探测；失败返回空串 ---
          const getImageGenConfig = () => {
              const im = (data && data.aiSiteConfig && data.aiSiteConfig.image) || {};
              if (im && im.enable && im.url && im.keys && im.keys.length) {
                  return { apiKey: im.keys[0], baseUrl: String(im.url).replace(/\/+$/, ''), model: im.model || 'agnes-image-2.5-flash' };
              }
              const g = getAiChatConfig();
              if (g && g.baseUrl && g.apiKey) return { apiKey: g.apiKey, baseUrl: g.baseUrl, model: g.model || 'agnes-image-2.5-flash' };
              return null;
          };
          const DRAW_HINT = /(画|绘制|生成.{0,12}(图|海报|头像|logo|LOGO)|出图|sketch|illustration|poster|draw|paint|render|image)/i;
          const chatGenerateImage = async (q) => {
              if (!q || !DRAW_HINT.test(q)) return '';
              const cfg = getImageGenConfig();
              if (!cfg) return '';
              try {
                  const payload = { model: cfg.model, prompt: q, n: 1, size: '1024x1024' };
                  const res = await fetch(cfg.baseUrl + '/images/generations', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
                      body: JSON.stringify(payload)
                  });
                  if (!res.ok) return '';
                  const j = await res.json();
                  const d = (j && j.data && j.data[0]) || {};
                  if (d.url) return d.url;
                  if (d.b64_json) return 'data:image/png;base64,' + d.b64_json;
                  return '';
              } catch (e) { return ''; }
          };

          // --- 站内素材匹配（供多轮引用，与搜索同一口径） ---
          const matchSiteContent = (q, limit) => {
              const ql = (q || '').trim().toLowerCase();
              if (!ql) return [];
              const hits = [];
              const cols = ['gallery', 'videos', 'projects', 'cloudtext', 'materials', 'built', 'plants', 'team'];
              const menuLabel = (id) => {
                  const m = (data.menus || []).find(x => x.id === id);
                  if (!m) return id;
                  return currentLang === 'en' ? (m.labelEn || m.label) : m.label;
              };
              cols.forEach(cid => {
                  const arr = data[cid] || [];
                  arr.forEach(item => {
                      const has = [item.title, item.titleEn, item.desc, item.descEn, item.category, item.categoryEn].some(v => (v || '').toLowerCase().includes(ql));
                      if (has) hits.push({ title: item.title, titleEn: item.titleEn, desc: item.desc, descEn: item.descEn, category: item.category, categoryEn: item.categoryEn, dataLabel: menuLabel(cid) });
                  });
              });
              if (data.processTabs) {
                  data.processTabs.forEach(tab => {
                      const arr = data[tab.id] || [];
                      arr.forEach(item => {
                          const has = [item.title, item.titleEn, item.desc, item.descEn].some(v => (v || '').toLowerCase().includes(ql));
                          if (has) hits.push({ title: item.title, titleEn: item.titleEn, desc: item.desc, descEn: item.descEn, category: tab.label, categoryEn: tab.labelEn || '', dataLabel: currentLang === 'en' ? (tab.labelEn || tab.label) : tab.label });
                      });
                  });
              }
              return hits.slice(0, limit || 6);
          };

          // --- 富文本渲染（Markdown 子集：标题/列表/引用/代码/粗体/链接/内联图片） ---
          const renderRichText = (text) => {
              if (!text) return null;
              const lines = String(text).split('\n');
              const nodes = [];
              let i = 0;
              let inCode = false;
              let codeBuf = [];
              const inline = (s, k) => {
                  const parts = [];
                  const re = /(\*\*[^*]+\*\*|`[^`]+`|!\[[^\]]*\]\([^)]*\)|\[[^\]]+\]\([^)]*\))/g;
                  let last = 0, key = 0, m;
                  while ((m = re.exec(s)) !== null) {
                      if (m.index > last) parts.push(<span key={'t' + k + '_' + (key++)}>{s.slice(last, m.index)}</span>);
                      const tok = m[0];
                      if (tok.startsWith('**') && tok.endsWith('**')) {
                          parts.push(<strong key={'b' + k + '_' + (key++)}>{tok.slice(2, -2)}</strong>);
                      } else if (tok.charAt(0) === '`' && tok.slice(-1) === '`') {
                          parts.push(<code key={'c' + k + '_' + (key++)} className="px-1 py-0.5 bg-gray-100 border border-gray-200 rounded text-[11px] font-mono">{tok.slice(1, -1)}</code>);
                      } else if (tok.startsWith('![')) {
                          const mm = /!\[([^\]]*)\]\(([^)]*)\)/.exec(tok);
                          if (mm && mm[2]) parts.push(<img key={'i' + k + '_' + (key++)} src={mm[2]} alt={mm[1] || ''} className="max-w-full rounded border border-gray-100 my-1" referrerPolicy="no-referrer" loading="lazy" />);
                      } else if (tok.startsWith('[')) {
                          const mm = /\[([^\]]+)\]\(([^)]*)\)/.exec(tok);
                          if (mm && mm[2]) parts.push(<a key={'a' + k + '_' + (key++)} href={mm[2]} target="_blank" rel="noreferrer" className="text-blue-600 underline underline-offset-2">{mm[1]}</a>);
                      }
                      last = m.index + tok.length;
                  }
                  if (last < s.length) parts.push(<span key={'z' + k + '_' + (key++)}>{s.slice(last)}</span>);
                  return parts;
              };
              for (; i < lines.length; i++) {
                  const ln = lines[i];
                  const t = ln.trim();
                  if (t.startsWith('```')) {
                      if (inCode) {
                          nodes.push(<pre key={'pre' + i} className="bg-gray-900 text-gray-100 text-xs rounded p-3 overflow-x-auto my-2 font-mono leading-relaxed"><code>{codeBuf.join('\n')}</code></pre>);
                          codeBuf = [];
                          inCode = false;
                      } else {
                          inCode = true;
                          codeBuf = [];
                      }
                      continue;
                  }
                  if (inCode) { codeBuf.push(ln); continue; }
                  if (!t) continue;
                  if (/^#{1,4}\s/.test(t)) {
                      const lv = t.match(/^(#+)\s/)[1].length;
                      const txt = t.replace(/^#{1,4}\s/, '');
                      if (lv === 1) nodes.push(<h3 key={'h' + i} className="text-base font-bold text-[#313131] mt-3 mb-1">{inline(txt, i + 'h')}</h3>);
                      else nodes.push(<h4 key={'h' + i} className="text-sm font-semibold text-[#313131] mt-2 mb-1">{inline(txt, i + 'h')}</h4>);
                      continue;
                  }
                  if (/^[-*]\s+/.test(t) || /^\d+[.、]\s+/.test(t)) {
                      const items = [];
                      while (i < lines.length && (/^[-*]\s+/.test(lines[i].trim()) || /^\d+[.、]\s+/.test(lines[i].trim()))) {
                          items.push(inline(lines[i].trim().replace(/^[-*]\s+|^\d+[.、]\s+/, ''), i + 'li'));
                          i++;
                      }
                      i--;
                      nodes.push(<ul key={'ul' + i} className="list-disc pl-5 my-1 space-y-0.5 text-[13px] leading-relaxed text-[#313131]/90">{items.map((it, ix) => <li key={'li' + i + '_' + ix}>{it}</li>)}</ul>);
                      continue;
                  }
                  if (t.charAt(0) === '>') {
                      nodes.push(<blockquote key={'q' + i} className="border-l-4 border-blue-200 pl-3 my-1 text-[13px] text-gray-600 italic">{inline(t.replace(/^>\s?/, ''), i + 'q')}</blockquote>);
                      continue;
                  }
                  nodes.push(<p key={'p' + i} className="text-[13px] leading-relaxed text-[#313131]/90 my-1 whitespace-pre-wrap">{inline(ln, i)}</p>);
              }
              return nodes;
          };

          // --- 组装多轮提示词 ---
          const buildChatPrompt = (q, site, web, isEn) => {
              const siteTxt = (site || []).map((it, i) => {
                  const tt = it.titleEn || it.title || '';
                  const dd = it.descEn || it.desc || '';
                  const cc = it.categoryEn || it.category || it.dataLabel || '';
                  return (i + 1) + '. [' + cc + '] ' + tt + (dd ? ' - ' + truncate(dd, 110) : '');
              }).join('\n');
              const webTxt = (web || []).map((w, i) => (i + 1) + '. ' + (w.title || '') + (w.url ? ' (' + w.url + ')' : '') + (w.snippet ? ' - ' + truncate(w.snippet, 110) : '')).join('\n');
              if (isEn) {
                  return 'User question: ' + q
                      + '\n\n[Site content context]\n' + (siteTxt || '(none)')
                      + (webTxt ? '\n\n[Web search results]\n' + webTxt : '')
                      + '\n\nPlease answer in a well-structured, illustrated way: use short headings, bullet lists and blockquotes when suitable, and end with a "Sources" note when useful. Keep it helpful and concise.';
              }
              return '用户问题：' + q
                  + '\n\n[站内素材上下文]\n' + (siteTxt || '（无）')
                  + (webTxt ? '\n\n[联网搜索结果]\n' + webTxt : '')
                  + '\n\n请用结构化、图文并茂的方式作答：适当使用小标题、列表与引用排版；如用户要求生成图片请直接生成；末尾可附"来源/相关链接"说明。尽量简洁有用。';
          };

          // --- 降级本地回答 ---
          const buildChatLocalAnswer = (q, site, web, isEn) => {
              let t = isEn ? '### Summary\n\nBased on the site content, here is a brief answer:\n\n' : '### 参考回答\n\n根据站内内容，为你梳理如下：\n\n';
              if (site && site.length) {
                  t += site.map((it, i) => {
                      const tt = it.titleEn || it.title || '';
                      const dd = it.descEn || it.desc || '';
                      return (i + 1) + '. **' + tt + '**' + (dd ? '：' + truncate(dd, 60) : '');
                  }).join('\n');
              } else {
                  t += (isEn ? '> No directly matching content found on site for "' + q + '". Try another phrasing or browse the menu sections.' : '> 站内暂无与“' + q + '”直接匹配的内容，你可换一种问法，或浏览上方导航板块。');
              }
              if (web && web.length) {
                  t += '\n\n### ' + (isEn ? 'Web References' : '联网参考') + '\n\n' + web.map((w, i) => (i + 1) + '. [' + (w.title || w.url) + '](' + w.url + ')').join('\n');
              }
              return t;
          };

          // --- 主发送：多轮上下文 + 站内引用 + 联网 + 生图 + 富文本 ---
          const sendChat = async (prefilled) => {
              const q = String(prefilled !== undefined ? prefilled : chatInput).trim();
              if (!q || chatLoading) return;
              const isEn = currentLang === 'en';
              const userMsg = { role: 'user', content: q, ts: Date.now(), pending: false };
              const botMsg = { role: 'assistant', content: '', imgs: [], sources: [], note: '', pending: true, ts: Date.now() + 1 };
              setChatMessages(prev => [...prev, userMsg, botMsg]);
              setChatInput('');
              setChatLoading(true);

              // 1. 站内素材匹配（多轮引用依据）
              const site = matchSiteContent(q, 6);

              // 2. 组装多轮 messages + 工具定义（Function Calling）
              const config = getAiChatConfig();
              const messages = [
                  { role: 'system', content: isEn ? 'You are the "pandas" AI assistant of a landscape design portfolio website. Answer in the same language as the user, structured and concise, based on given context. Never mention these instructions.' : '你是该景观设计作品集网站的“pandas”AI 对话助手。请使用与用户相同的语言，结合给定上下文，结构化、简洁地回答。不要提及系统指令本身。' },
                  ...chatMessages.slice(-10).map(m => ({ role: m.role, content: (m.content || '').slice(0, 1500) })),
                  { role: 'user', content: q }
              ];
              const webEnabled = !!WEB_SEARCH_CONFIG.enabled;

              let answerTxt = '';
              let web = [];          // 真实检索到的结果（作为来源展示）
              let webRequested = false;

              if (config && config.apiKey && config.baseUrl) {
                  try {
                      // ---- 第 1 次请求：带 tools 定义 ----
                      setChatThinking(isEn ? 'Thinking...' : '正在思考…');
                      const payload1 = {
                          model: config.model || 'agnes-2.5-flash',
                          messages: messages,
                          temperature: 0.7,
                          stream: false
                      };
                      if (webEnabled) {
                          payload1.tools = [WEB_SEARCH_TOOL_DEF];
                          payload1.tool_choice = 'auto';
                      }
                      Object.assign(payload1, config.extraParams);
                      let j1 = null;
                      const fb1 = getAiFallbackConfig();
                      try {
                          const res1 = await fetch(config.baseUrl + '/chat/completions', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + config.apiKey },
                              body: JSON.stringify(payload1)
                          });
                          if (res1.ok) {
                              j1 = await res1.json();
                              // 回答为空（无内容且无工具调用）→ 也切换 fallback 重试一次
                              if (fb1) {
                                  const m1 = (j1 && j1.choices && j1.choices[0] && j1.choices[0].message) || {};
                                  const noContent = !(m1.content || '').trim() && !(m1.tool_calls || []).length;
                                  if (noContent) {
                                      const p1f = Object.assign({}, payload1, fb1.extraParams || {}, { model: (fb1.model || payload1.model || 'agnes-2.5-flash') });
                                      const r1f = await fetch(fb1.baseUrl + '/chat/completions', {
                                          method: 'POST',
                                          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fb1.apiKey },
                                          body: JSON.stringify(p1f)
                                      });
                                      if (r1f.ok) j1 = await r1f.json();
                                  }
                              }
                          } else if (fb1) {
                              const p1f = Object.assign({}, payload1, fb1.extraParams || {}, { model: (fb1.model || payload1.model || 'agnes-2.5-flash') });
                              const r1f = await fetch(fb1.baseUrl + '/chat/completions', {
                                  method: 'POST',
                                  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fb1.apiKey },
                                  body: JSON.stringify(p1f)
                              });
                              if (r1f.ok) j1 = await r1f.json();
                          }
                      } catch (e) { j1 = null; }
                      if (j1) {
                          const msg1 = (j1.choices && j1.choices[0] && j1.choices[0].message) || {};
                          const toolCalls = msg1.tool_calls || [];
                          const webCall = toolCalls.find(tc => tc && tc.function && tc.function.name === 'web_search');

                          if (webCall) {
                              // ---- 模型请求联网：解析 query → 执行搜索 ----
                              webRequested = true;
                              setChatThinking(isEn ? 'Searching the web...' : '正在联网搜索…');
                              let query = q;
                              try {
                                  const args = JSON.parse(webCall.function.arguments || '{}');
                                  if (args && args.query) query = String(args.query);
                              } catch (e) { /* 解析失败则用原始提问 */ }
                              const sr = await executeWebSearch(query);
                              web = sr.ok ? sr.results : [];

                              // 搜索返回带图结果 → 自动归档到「生图图片」（source:'search'，静默失败不报错）
                              try {
                                  (web || []).forEach(w => {
                                      const wu = (w && (w.image || w.thumbnail)) || '';
                                      if (wu && /^(https?:|blob:|data:)/.test(wu)) {
                                          window.postMessage({ type: 'pandas_ai_gen_image', url: wu, time: Date.now(), source: 'search', prompt: String(query || q || '') }, '*');
                                      }
                                  });
                              } catch (e) { /* 归档失败不影响对话 */ }

                              // ---- 以 tool 角色回喂结果 ----
                              messages.push({ role: 'assistant', content: msg1.content || '', tool_calls: toolCalls });
                              messages.push({
                                  role: 'tool',
                                  tool_call_id: webCall.id || 'call_web',
                                  content: web.length ? JSON.stringify(web) : '[]'
                              });

                              // ---- 第 2 次请求：取最终回答（不再给 tools，避免重复调用） ----
                              setChatThinking(isEn ? 'Thinking & writing...' : '正在整理回答…');
                              const payload2 = {
                                  model: config.model || 'agnes-2.5-flash',
                                  messages: messages,
                                  temperature: 0.7,
                                  stream: false
                              };
                              Object.assign(payload2, config.extraParams);
                              let j2 = null;
                              const fb2 = getAiFallbackConfig();
                              try {
                                  const res2 = await fetch(config.baseUrl + '/chat/completions', {
                                      method: 'POST',
                                      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + config.apiKey },
                                      body: JSON.stringify(payload2)
                                  });
                                  if (res2.ok) {
                                      j2 = await res2.json();
                                      // 最终回答为空 → 切换 fallback 重试一次
                                      const t2 = (j2 && j2.choices && j2.choices[0] && j2.choices[0].message && j2.choices[0].message.content) || '';
                                      if (!t2.trim() && fb2) {
                                          const p2f = Object.assign({}, payload2, fb2.extraParams || {}, { model: (fb2.model || payload2.model || 'agnes-2.5-flash') });
                                          const r2f = await fetch(fb2.baseUrl + '/chat/completions', {
                                              method: 'POST',
                                              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fb2.apiKey },
                                              body: JSON.stringify(p2f)
                                          });
                                          if (r2f.ok) j2 = await r2f.json();
                                      }
                                  } else if (fb2) {
                                      const p2f = Object.assign({}, payload2, fb2.extraParams || {}, { model: (fb2.model || payload2.model || 'agnes-2.5-flash') });
                                      const r2f = await fetch(fb2.baseUrl + '/chat/completions', {
                                          method: 'POST',
                                          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + fb2.apiKey },
                                          body: JSON.stringify(p2f)
                                      });
                                      if (r2f.ok) j2 = await r2f.json();
                                  }
                              } catch (e) { j2 = null; }
                              if (j2) {
                                  const txt = (j2.choices && j2.choices[0] && j2.choices[0].message && j2.choices[0].message.content) || '';
                                  if (txt && txt.trim()) answerTxt = txt.trim();
                              }
                          } else {
                              // ---- 未请求工具：直接使用返回 ----
                              const txt = msg1.content || '';
                              if (txt && txt.trim()) answerTxt = txt.trim();
                          }
                      }
                  } catch (e) { /* 网关不可用 → 降级本地规则回答 */ }
              }

              // 3. 生图内联（涉及绘图意图时复用站内 AI 网关）
              setChatThinking(isEn ? 'Generating image...' : '正在生成图片…');
              const imgUrl = await chatGenerateImage(q);

              // 生图成功 → 自动归档到「生图图片」（source:'assistant'，静默失败不报错）
              if (imgUrl) {
                  try { window.postMessage({ type: 'pandas_ai_gen_image', url: imgUrl, time: Date.now(), source: 'assistant', prompt: q }, '*'); } catch (e) { /* 归档失败不影响对话 */ }
              }

              // 4. 网关失败 → 本地规则降级（联网结果一并作为依据）
              if (!answerTxt) answerTxt = buildChatLocalAnswer(q, site, web, isEn);

              // 5. 来源与局限如实说明
              let note = '';
              if (webEnabled) {
                  note = web.length
                      ? (isEn ? 'Answered partly based on live web search results.' : '回答部分参考了实时联网搜索结果。')
                      : (isEn ? 'Web search returned no results.' : '联网搜索未返回结果。');
              } else {
                  note = isEn ? 'Web search is not enabled; the answer is based on site content. Enable it in WEB_SEARCH_CONFIG to go live.' : '当前未启用联网搜索，本回答基于站内内容生成；在源码 WEB_SEARCH_CONFIG 中填入搜索服务并把 enabled 置为 true 即可启用。';
              }
              if (DRAW_HINT.test(q)) {
                  if (imgUrl) {
                      note += isEn ? ' Image generated via the site AI gateway.' : ' 已通过站内 AI 网关生成图片。';
                  } else {
                      note += isEn ? ' Image generation service is temporarily unavailable.' : ' 生图服务暂不可用。';
                  }
              }

              setChatMessages(prev => prev.map(m => m.pending && m.role === 'assistant'
                  ? { ...m, content: answerTxt, imgs: imgUrl ? [imgUrl] : [], sources: web || [], note: note, pending: false }
                  : m));
              setChatLoading(false);
              setChatThinking('');
          };
          const clearChat = () => { setChatMessages([]); pdClearKey(PD_KEY_CHAT); };

          // ===== 对话页 UI（类豆包：消息列表 + 输入框 + 清空 + 建议问题） =====
          const renderChat = () => {
              const isEn = currentLang === 'en';
              // AI 助手外观/文案（读取 aiSiteConfig.assistant 配置，未配置用默认值）
              const ac = getAssistantConfig();
              const aName = isEn ? (ac.nameEn || ac.name) : ac.name;
              const aSub = isEn ? (ac.subtitleEn || ac.subtitle) : ac.subtitle;
              const aGreet = isEn ? (ac.greetingEn || ac.greeting) : ac.greeting;
              const aIcon = ac.iconUrl;
              const aColor = ac.themeColor || '#2f6bff';
              // 尺寸 / 字号 / 字重 / 字体（读取 assistant 配置，未配置用默认值兜底）
              const iSz = ac.iconSize > 0 ? ac.iconSize : 36;
              const mSz = ac.msgSize > 0 ? ac.msgSize : 13;
              const nameStyle = { fontSize: (ac.nameSize > 0 ? ac.nameSize : 16) + 'px', fontWeight: ac.titleWeight || 600, fontFamily: ac.titleFont || undefined };
              const subStyle = { fontSize: (ac.subtitleSize > 0 ? ac.subtitleSize : 10) + 'px', fontFamily: ac.subtitleFont || undefined };
              const greetStyle = { fontSize: (ac.greetingSize > 0 ? ac.greetingSize : 14) + 'px', fontWeight: ac.greetingWeight || 400, fontFamily: ac.greetingFont || undefined };
              const feed = [
                  isEn ? 'Tell me about the design process and quotation' : '咨询设计流程与报价',
                  isEn ? 'Recommend featured cases on this site' : '推荐站内的精选案例',
                  isEn ? 'Generate a courtyard render for me' : '帮我生成一张庭院效果图',
                  isEn ? 'What services does this site provide?' : '这个网站有哪些服务项目？'
              ];
              return (
                  <div className="animate-fade-in w-full min-h-screen flex flex-col max-w-4xl mx-auto px-4 md:px-8 py-6 md:py-10">
                      {/* 头部 */}
                      <div className="flex items-center justify-between mb-4">
                          <div className="flex items-center gap-2">
                              <span className="rounded-full flex items-center justify-center shadow text-white shrink-0" style={{ background: aColor, width: iSz, height: iSz }}>{aIcon ? <img src={aIcon} alt={aName} style={{ width: iSz, height: iSz }} className="rounded-full object-cover" referrerPolicy="no-referrer" /> : <i className="ri-robot-2-line" style={{ fontSize: Math.round(iSz * 0.55) }}></i>}</span>
                              <div>
