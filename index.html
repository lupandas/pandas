                                                  {isEditing && <button onClick={()=>handleRemoveArrayItem('contactData.items',c.id)} className="absolute top-0 right-0 bg-red-500 text-white rounded w-5 h-5 text-xs z-30">✕</button>}
                                                  
                                                  <a href={href} target={isExternal ? "_blank" : undefined} rel={isExternal ? "noopener noreferrer" : undefined} className={`w-16 h-16 rounded-2xl bg-white flex items-center justify-center p-3 shadow-sm border border-aman-border mb-4 transition-transform group-hover:-translate-y-2 relative ${href?'cursor-pointer':'cursor-default'}`}>
                                                      {isEditing && <input className="absolute inset-x-0 top-0 bg-white/90 text-[10px] p-1 text-center border-b z-20" placeholder="Icon类名" value={c.icon} onChange={e=>handleArrayEdit('contactData.items',c.id,'icon',e.target.value)} onClick={e=>e.stopPropagation()}/>}
                                                      <i className={`${c.icon} text-3xl text-aman-text blend-multiply`}></i>
                                                  </a>
                                                  
                                                  <EditableArrayText item={c} data={data} lang={currentLang} isEditing={isEditing} onEdit={handleArrayEdit} arrayName="contactData.items" field="label" tag="h3" className="font-serif text-[12px] md:text-sm tracking-widest mb-1 text-[#313131]" />
                                                  <EditableArrayText item={c} data={data} lang={currentLang} isEditing={isEditing} onEdit={handleArrayEdit} arrayName="contactData.items" field="value" tag="p" className="text-[10px] text-aman-muted mb-4" />
                                                  
                                                  {isEditing && <input className="w-full p-1.5 text-[10px] text-center border outline-none text-blue-500 mb-2 rounded bg-gray-50" placeholder="点击跳转的外链 URL / tel:" value={c.link||''} onChange={e=>handleArrayEdit('contactData.items',c.id,'link',e.target.value)} onClick={e=>e.stopPropagation()}/>}

                                                  <div className="w-20 h-20 bg-gray-200 p-1 rounded-sm relative">
                                                      {isEditing && <input className="absolute inset-0 bg-black/60 text-white text-[8px] p-1 break-all z-20" placeholder="二维码图片 URL" value={c.qr} onChange={e=>handleArrayEdit('contactData.items',c.id,'qr',e.target.value)} onClick={e=>e.stopPropagation()}/>}
                                                      {(c.link||'').startsWith('tel:') ? <div className="w-full h-full flex flex-col items-center justify-center border border-dashed text-[10px] text-gray-500 bg-white"><i className="ri-phone-line mb-1"></i>{currentLang==='en'?'Call':'直拨热线'}</div> : (c.qr ? <img src={c.qr} className="w-full h-full object-cover" /> : <div className="w-full h-full flex flex-col items-center justify-center border border-dashed text-[10px] text-gray-500 bg-white"><i className="ri-qr-code-line mb-1"></i>{currentLang==='en'?'QR Code':'二维码'}</div>)}
                                                  </div>
                                              </div>
                                              );
                                          })}
                                      </div>
                                      <div className="mt-20 text-center text-xs tracking-widest text-[#313131] border-t border-aman-border/50 pt-8 w-full px-4">
                                          <EditableText data={data} lang={currentLang} isEditing={isEditing} onEdit={handleEditObj} field="coop" source="contactData" tag="p" className="mb-2 break-all" />
                                          <EditableText data={data} lang={currentLang} isEditing={isEditing} onEdit={handleEditObj} field="addr" source="contactData" tag="p" className="break-all" />
                                      </div>
                                  </div>
                              );
                          }
                          
                          if (routeMenu.id === 'ai_prompt' || routeMenu.template === 'ai_prompt') {
                              return (
                                  <div className="animate-fade-in" style={{height: 'calc(100vh - 180px)', overflow: 'hidden'}}>
                                      <PromptGallery />
                                  </div>
                              );
                          }
                          
if (routeMenu.id === 'ai_site' || routeMenu.template === 'ai') {
                              return (
                                  <div className="animate-fade-in" style={{height: 'calc(100vh - 180px)', padding: '14px', boxSizing: 'border-box', display: 'flex', flexDirection: 'column'}}>
                                      <iframe
                                          key={aiSiteIframeKey}
                                          srcDoc={buildAiSiteSrcdoc()}
                                          title="AI 生图工作台"
                                          style={{width: '100%', height: '100%', border: '1px solid #e6dcd0', borderRadius: '12px', background: '#fff', display: 'block'}}
                                      />
                                  </div>
                              );
                          }
                          if (routeMenu.id === 'ai_gallery') {
                              const imgs = aiImages;
                              const SOURCE_LABELS = currentLang === 'en'
                                  ? { ai: 'AI Generate', style: 'Image-to-Image', manual: 'Manual', video: 'AI Video', chat: 'AI Chat', assistant: 'AI Chat', search: 'Web Search' }
                                  : { ai: '专业生图', style: '图生图', manual: '手动生图', video: 'AI视频', chat: 'AI对话', assistant: 'AI助手', search: '联网搜索' };
                              return (
                                  <div className="animate-fade-in" style={{padding: '20px 16px', boxSizing: 'border-box'}}>
                                      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px', marginBottom: '14px'}}>
                                          <div>
                                              <div className="text-xl font-bold" style={{color: '#313131'}}>{(currentLang === 'en' ? 'AI Gallery' : '生图图片')} {imgs.length ? `(${imgs.length})` : ''}</div>
                                              <div className="text-sm" style={{color: '#9a8f80'}}>{currentLang === 'en' ? 'Auto-collected from all AI generation channels, updated in real time.' : '由 AI 生图工作台各通道生成，自动收集归档，随生成实时更新'}</div>
                                          </div>
                                          <button onClick={clearAiImages} className="text-sm border rounded px-3 py-1" style={{borderColor: '#d8cfc0', color: '#8a7f70', background: '#fff'}}>{currentLang === 'en' ? 'Clear Archive' : '清空归档'}</button>
                                      </div>
                                      {imgs.length === 0 ? (
                                          <div style={{border: '1px dashed #d8cfc0', borderRadius: '12px', padding: '60px 20px', textAlign: 'center', color: '#9a8f80', background: '#fff'}}>
                                              <div style={{fontSize: 40, marginBottom: 8}}>🖼️</div>
                                              {currentLang === 'en' ? 'No images yet. Generate one in the AI Studio and it will appear here automatically.' : '暂无生成图片。前往「AI生图」工作台生成图片后会实时自动出现在这里。'}
                                          </div>
                                      ) : (
                                          <div style={{columns: '260px 4', columnGap: '14px', width: '100%'}}>
                                              {imgs.map((it, idx) => {
                                                  const isVid = /\.(mp4|webm|mov)(\?|#|$)/i.test(it.url || '');
                                                  return (
                                                      <div key={it.url + '_' + (it.time || '')} style={{breakInside: 'avoid', marginBottom: '14px', borderRadius: '12px', overflow: 'hidden', border: '1px solid #e6dcd0', background: '#fff', boxShadow: '0 1px 4px rgba(0,0,0,0.06)'}}>
                                                          {isVid ? (
                                                              <video src={it.url} controls preload="metadata" style={{width: '100%', display: 'block', aspectRatio: '1/1', objectFit: 'cover', background: '#000'}} />
                                                          ) : (
                                                              <img src={it.url} loading="lazy" referrerPolicy="no-referrer" style={{width: '100%', display: 'block'}} />
                                                          )}
                                                          <div style={{padding: '8px 10px', fontSize: 12, color: '#8a7f70', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8}}>
                                                              <span>{(SOURCE_LABELS[it.source] || (it.source && it.source !== 'unknown' ? it.source : 'AI生成'))}</span>
                                                              <span style={{display: 'inline-flex', alignItems: 'center', gap: 8}}>
                                                                  {!isVid ? (
                                                                      <button
                                                                          onClick={(e) => { e.stopPropagation(); downloadAiImage(it.url, it.time, idx); }}
                                                                          title={currentLang === 'en' ? 'Download image' : '下载图片'}
                                                                          className="text-sm border rounded px-2 py-0.5 flex items-center gap-1"
                                                                          style={{borderColor: '#d8cfc0', color: '#8a7f70', background: '#fff', cursor: 'pointer', whiteSpace: 'nowrap'}}
                                                                      >
                                                                          <i className="ri-download-line" style={{fontSize: 13}}></i>
                                                                          {currentLang === 'en' ? 'Save' : '下载'}
                                                                      </button>
                                                                  ) : null}
                                                                  <span>{it.time ? new Date(it.time).toLocaleString() : ''}</span>
                                                              </span>
                                                          </div>
                                                          {it.prompt ? <div title={it.prompt} style={{padding: '6px 10px 8px', fontSize: 11, color: '#3f6ec0', background: '#f3f7ff', borderTop: '1px solid #e6edfb', lineHeight: 1.5, wordBreak: 'break-all', maxHeight: 62, overflow: 'hidden'}}><i className="ri-quill-pen-line" style={{marginRight: 4, verticalAlign: -1}}></i><span style={{opacity: .75}}>提示词：</span>{it.prompt}</div> : null}
                                                      </div>
                                                  );
                                              })}
                                          </div>
                                      )}
                                  </div>
                              );
                          }
                          if (routeMenu.template === 'video' || routeMenu.id === 'videos') return renderGalleryStyle(routeMenu.id, routeMenu.label, '');
                          if (routeMenu.template === 'price' || ['jizhuang','materials','shuidian','plants','cuoshi'].includes(routeMenu.id)) return renderGalleryStyle(routeMenu.id, routeMenu.label, '', true);
                          if (routeMenu.template === 'image' || routeMenu.id === 'gallery' || routeMenu.id === 'materials' || routeMenu.id === 'plants') return renderGalleryStyle(routeMenu.id, routeMenu.label, '', true);
                          if (routeMenu.template === 'process' || routeMenu.id.startsWith('process')) return renderProcess(routeMenu.id, routeMenu.label);
                          if (routeMenu.template === 'quote' || routeMenu.id === 'quote') return renderQuote(routeMenu.id);
                          if (routeMenu.template === 'pdf') return renderPdfCases(routeMenu.id);
                          if (routeMenu.template === 'case' || routeMenu.id === 'projects' || routeMenu.id === 'cloudtext' || routeMenu.id === 'built') return renderGalleryStyle(routeMenu.id, routeMenu.label, '');
                          
                          return null;
                      })()}
                  </main>

                  <footer className={`bg-transparent pt-16 pb-10 border-t border-aman-border/50 transition-all duration-300 ${isEditing ? 'sm:ml-[300px]' : ''}`}>
                      <div className="w-full px-4 md:px-8 flex flex-col items-center">
                          {data.logos.footer.type === 'image' && data.logos.footer.imgUrl ? (
                              <img src={data.logos.footer.imgUrl} className="object-contain mb-8" style={{height: data.logos.footer.imgSize || '48px'}} />
                          ) : (
                              <div className="text-center mb-8 cursor-pointer" onClick={isEditing ? (e) => { e.stopPropagation(); } : undefined}>
                                  <div className="font-logo text-2xl tracking-widest-xl uppercase text-[#313131]" style={getMergedStyles(data, 'logo_footer')}>{currentLang === 'en' ? (data.logos.footer.textEn || data.logos.footer.text) : data.logos.footer.text}</div>
                                  <div className="text-[10px] tracking-[0.4em] text-gray-400 mt-2">{currentLang === 'en' ? (data.logos.footer.subEn || data.logos.footer.sub) : data.logos.footer.sub}</div>
                              </div>
                          )}
                          
                          <div className="flex space-x-6 mb-8 text-[#313131]">
                              {(data.contactData?.items||[]).map(c => (
                                  <a key={c.id} href={c.link} className="opacity-60 hover:opacity-100 transition-opacity"><i className={`${c.icon} text-xl`}></i></a>
                              ))}
                          </div>
                          <div className="text-xs text-gray-400 tracking-widest text-center border-t border-aman-border pt-6 w-full flex flex-col md:flex-row justify-center items-center gap-4">
                              <p>&copy; {new Date().getFullYear()} {currentLang === 'en' ? (data.uiTexts?.footerCopyEn || 'PANDAS') : (data.uiTexts?.footerCopy || 'PANDAS')}. All Rights Reserved.</p>
                              <div className="flex gap-4">
                                  <a href="#" className="hover:text-gray-600 transition-colors">{currentLang === 'en' ? (data.uiTexts?.footerPrivacyEn || 'Privacy Policy') : (data.uiTexts?.footerPrivacy || '隐私政策')}</a>
                                  <a href="#" className="hover:text-gray-600 transition-colors">{currentLang === 'en' ? (data.uiTexts?.footerTermsEn || 'Terms of Use') : (data.uiTexts?.footerTerms || '使用条款')}</a>
                                  <a href="#" className="hover:text-gray-600 transition-colors">{currentLang === 'en' ? (data.uiTexts?.footerIcpEn || '') : (data.uiTexts?.footerIcp || '')}</a>
                              </div>
                          </div>
                      </div>
                  </footer>

                  {/* 方案文本案例：后台编辑弹窗 */}
                  {pdfEditOpen && pdfEditing && (
                      <div className="fixed inset-0 z-[160] bg-black/40 flex items-center justify-center backdrop-blur-sm px-4" onClick={closePdfEdit}>
                          <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-md animate-fade-in max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                              <h3 className="font-bold text-lg mb-4 text-[#313131]">{pdfEditing.id ? '编辑案例' : '新增案例'}</h3>
                              <div className="space-y-3">
                                  <div>
                                      <label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">标题 Title *</label>
                                      <input className="w-full p-2 border rounded outline-none focus:border-blue-500 text-xs" placeholder="文档标题" value={pdfEditing.title || ''} onChange={e => setPdfEditing({ ...pdfEditing, title: e.target.value })} />
                                  </div>
                                  <div>
                                      <label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">封面 Cover</label>
                                      <input className="w-full p-2 border rounded outline-none focus:border-blue-500 text-xs" placeholder="图片 URL" value={pdfEditing.cover || ''} onChange={e => setPdfEditing({ ...pdfEditing, cover: e.target.value })} />
                                      {pdfEditing.cover && <div className="mt-2 aspect-video w-full rounded overflow-hidden border border-gray-200"><img src={pdfEditing.cover} className="w-full h-full object-cover" alt="cover" /></div>}
                                  </div>
                                  <div>
                                      <label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">内容简述 Description</label>
                                      <textarea rows={3} className="w-full p-2 border rounded outline-none focus:border-blue-500 text-xs resize-none" placeholder="内容简述..." value={pdfEditing.description || ''} onChange={e => setPdfEditing({ ...pdfEditing, description: e.target.value })} />
                                  </div>
                                  <div>
                                      <label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">访问密码 Access Password</label>
                                      <input type="text" className="w-full p-2 border rounded outline-none focus:border-blue-500 text-xs" placeholder="留空则公开免密访问" value={pdfEditing.password || ''} onChange={e => setPdfEditing({ ...pdfEditing, password: e.target.value })} />
                                  </div>
                                  <div>
                                      <label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase tracking-widest">PDF URL *</label>
                                      <input className="w-full p-2 border rounded outline-none focus:border-blue-500 text-xs font-mono" placeholder="https://..." value={pdfEditing.pdfUrl || ''} onChange={e => setPdfEditing({ ...pdfEditing, pdfUrl: e.target.value })} />
                                  </div>
                              </div>
                              <div className="mt-6 flex gap-2">
                                  <button onClick={closePdfEdit} className="flex-1 py-2.5 bg-white border border-gray-200 text-gray-600 rounded text-xs font-bold hover:bg-gray-50 transition-colors">取消</button>
                                  <button onClick={savePdfCase} className="flex-1 py-2.5 bg-[#313131] text-white rounded text-xs font-bold hover:bg-black transition-colors shadow-sm">保存</button>
                              </div>
                          </div>
                      </div>
                  )}

                  {/* 方案文本案例：全屏 PDF 安全预览（参照 pandas_pdf.html，toolbar 隐藏防下载） */}
                  {pdfPreview && (() => {
                      const base = pdfPreview.pdfUrl || '';
                      const pdfSrc = base + (base.includes('?') ? '&' : '?') + 'toolbar=0&navpanes=0&scrollbar=0';
                      return (
                          <div className="fixed inset-0 z-[170] flex flex-col items-center justify-center px-2 md:px-8 py-2 bg-black/85 backdrop-blur-xl">
                              <div className="absolute top-0 left-0 w-full px-4 md:px-8 py-4 md:py-6 flex justify-between items-center z-20">
                                  <h3 className="text-white font-serif text-base md:text-lg tracking-wider drop-shadow-md truncate max-w-[50vw]">{pdfPreview.title}</h3>
                                  <button onClick={closePdfPreview} className="w-10 h-10 shrink-0 flex items-center justify-center rounded-full bg-white/10 text-white/70 hover:text-white hover:bg-white/20 transition-all"><i className="ri-close-line text-xl"></i></button>
                              </div>
                              {!pdfVerified ? (
                                  <div className="relative z-10 w-full max-w-sm bg-white p-8 rounded-xl shadow-2xl flex flex-col items-center">
                                      <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mb-6"><i className="ri-lock-2-line text-3xl"></i></div>
                                      <h3 className="font-serif text-[#313131] text-xl mb-2">{currentLang === 'en' ? 'Confidential Document Verification' : '机密文档安全验证'}</h3>
                                      <p className="text-xs text-aman-muted mb-6 text-center tracking-wide leading-relaxed">{currentLang === 'en' ? 'This document is copyright protected. Download and right-click have been disabled.' : '该设计文档受版权保护，系统已禁用下载与右键。'}<br />{currentLang === 'en' ? 'Please enter the access code.' : '请输入阅读访问码。'}</p>
                                      <div className="w-full relative mb-4">
                                          <input value={pdfVerifyCode} type="password" placeholder={currentLang === 'en' ? 'Enter access code' : '请输入访问码'} className="w-full text-center p-3 border border-gray-200 rounded-md outline-none focus:border-blue-500 text-sm tracking-widest bg-gray-50" onChange={e => setPdfVerifyCode(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') submitPdfVerify(); }} />
                                          {pdfVerifyError && <p className="absolute -bottom-5 left-0 w-full text-center text-[10px] text-red-500 font-bold">{pdfVerifyError}</p>}
                                      </div>
                                      <button onClick={submitPdfVerify} className="w-full py-3 bg-[#313131] text-white rounded-md text-xs font-bold tracking-widest hover:bg-black transition-colors uppercase shadow-md">{currentLang === 'en' ? 'Verify & Read' : '验证并阅读'}</button>
                                  </div>
                              ) : (
                                  <div className="relative w-full max-w-[1400px] h-full max-h-[80vh] md:mt-12 shadow-2xl rounded-xl overflow-hidden bg-white/5 border border-white/20 flex items-center justify-center backdrop-blur-md ring-1 ring-black/5">
                                      <div className="absolute inset-0 z-20 pointer-events-none" style={{ boxShadow: 'inset 0 0 50px rgba(0,0,0,0.5)' }}></div>
                                      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-white/50 z-0">
                                          <i className="ri-shield-check-line animate-pulse text-4xl mb-3 text-emerald-400"></i>
                                          <span className="text-xs tracking-[0.2em] uppercase font-serif">Loading Secure PDF...</span>
                                      </div>
                                      <iframe src={pdfSrc} className="w-full h-full border-0 relative z-10 bg-white" title="PDF Preview" onLoad={(e) => { e.target.style.opacity = 1; }} style={{ opacity: 0, transition: 'opacity 0.5s' }} />
                                  </div>
                              )}
                          </div>
                      );
                  })()}

                  {/* 全局悬浮组件 (播放器/大图) */}
                  {playingVideo && (() => {
                      const parsed = parseVideoUrl(playingVideo);
                      let iframeSrc = parsed.url;
                      if (parsed.isIframe && iframeSrc.includes('bilibili')) {
                          // 核心修复：取消全局弹窗的强制自动播放，改为用户手动点击。
                          // 这是让 B站 iframe 允许放出声音的唯一可靠方式。
                          if (iframeSrc.includes('autoplay=')) {
                              iframeSrc = iframeSrc.replace(/autoplay=\d+/, 'autoplay=0');
                          } else {
                              iframeSrc += (iframeSrc.includes('?') ? '&' : '?') + 'autoplay=0';
                          }
                          if (!iframeSrc.includes('danmaku=')) iframeSrc += '&danmaku=0';
                      }
                      return <VideoFullscreenPlayer key={playingVideo} parsed={parsed} iframeSrc={iframeSrc} onClose={() => setPlayingVideo(null)} />;
                  })()}

                  {lightboxImg && (() => {
                      const bg = data.backgrounds['detail'] || { type: 'color', color: '#ffffff' };
                      const total = lightboxList && lightboxList.length ? lightboxList.length : 1;
                      const cur = (lightboxIndex % total + total) % total;
                      return (
                          <div className="fixed inset-0 z-[100] bg-white/90 flex items-center justify-center backdrop-blur-lg animate-fade-in" onClick={closeLightbox}>
                              <div className="absolute inset-0 pointer-events-none" style={{ 
                                  backgroundColor: bg.type === 'color' ? bg.color : 'transparent',
                                  backgroundImage: bg.type === 'gradient' ? bg.color : (bg.type === 'image' ? `url(${bg.imageUrl})` : 'none'),
                                  backgroundSize: 'cover', backgroundPosition: 'center',
                                  opacity: bg.opacity !== undefined ? bg.opacity/100 : 1
                              }}>
                                  {bg.type === 'particles' && <ParticlesBackground color={bg.color} />}
                              </div>
                              <button onClick={(e)=>{e.stopPropagation(); closeLightbox();}} className="absolute top-6 right-6 md:top-8 md:right-8 text-[#313131] hover:text-black z-10 bg-white/50 hover:bg-white p-2 rounded-full backdrop-blur-md transition-all shadow"><i className="ri-close-line text-2xl"></i></button>
                              {total > 1 && (
                                  <>
                                      <button onClick={(e)=>{e.stopPropagation(); stepLightbox(-1);}} className="absolute left-4 md:left-8 top-1/2 -translate-y-1/2 text-[#313131] hover:text-black z-10 bg-white/60 hover:bg-white p-3 rounded-full backdrop-blur-md transition-all shadow-xl"><i className="ri-arrow-up-s-line text-3xl"></i></button>
                                      <button onClick={(e)=>{e.stopPropagation(); stepLightbox(1);}} className="absolute right-4 md:right-8 top-1/2 -translate-y-1/2 text-[#313131] hover:text-black z-10 bg-white/60 hover:bg-white p-3 rounded-full backdrop-blur-md transition-all shadow-xl"><i className="ri-arrow-down-s-line text-3xl"></i></button>
                                      <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 bg-black/60 text-white text-xs px-4 py-2 rounded-full backdrop-blur-md tracking-widest">{cur + 1} / {total}</div>
                                  </>
                              )}
                              <div className="relative w-full max-w-7xl max-h-[90vh] flex justify-center items-center pointer-events-none z-10">
                                  <img src={lightboxImg} draggable={false} onContextMenu={(e)=>e.preventDefault()} className="max-w-full max-h-[85vh] object-contain shadow-2xl rounded pointer-events-auto select-none" onClick={e=>e.stopPropagation()} />
                              </div>
                          </div>
                      );
                  })()}

                  {toastMsg && (
                      <div className="fixed bottom-10 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-full shadow-2xl z-[150] transition-opacity font-medium text-sm flex items-center gap-2 animate-fade-in whitespace-nowrap">
                          {toastMsg}
                      </div>
                  )}
              </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    
    
    
    
    
    
    
    
    
    
    
    
    </script>
</body>
</html>
