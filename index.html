              const isPriceMode = (data.menus?.find(m=>m.id===arrayName)?.template === 'price') || PRICE_MENU_IDS.includes(arrayName);
              const displayTitle = currentLang === 'en' ? (data.menus?.find(m=>m.id===arrayName)?.labelEn || title) : title;

              const categories = Array.from(new Set(list.map(i => i.category).filter(Boolean)));
              const categoryMap = {};
              list.forEach(i => {
                  if (i.category && !categoryMap[i.category]) {
                      categoryMap[i.category] = i.categoryEn || i.category;
                  }
              });
              const currentFilter = activeFilters[arrayName] || 'All';
              const filteredList = currentFilter === 'All' ? list : list.filter(i => i.category === currentFilter);

              let batchBtnLabel = "批量导入图片";
              let batchBtnIcon = "ri-folder-add-line";
              if (arrayName === 'videos') {
                  batchBtnLabel = "批量导入视频";
                  batchBtnIcon = "ri-video-upload-line";
              } else if (arrayName === 'projects' || arrayName === 'built' || arrayName === 'cloudtext') {
                  batchBtnLabel = "批量导入项目";
              }

              return (
                  <div className={`animate-fade-in py-10 px-4 md:px-8 w-full ${isMasonry ? 'bg-white/50' : ''}`}>
                      <div className="text-center mb-8 flex flex-col justify-center items-center gap-4">
                          <div>
                              <h1 className="text-3xl font-serif tracking-widest text-[#313131]">{displayTitle}</h1>
                          </div>
                          {isEditing && (
                              <div className="flex gap-3 mt-2">
                                  <button onClick={()=>handleAddArrayItem(arrayName, isPriceMode ? {title:'新项目', category:'分类', img:'', desc:'', vid:'', media:[], price:'', unit:'', spec:'', remark:''} : {title:'新项目', category:'分类', img:'', desc:'', vid:'', media:[]})} className="text-xs bg-blue-100 text-blue-700 font-bold px-4 py-2 rounded-full shadow-sm hover:bg-blue-200 transition-colors"><i className="ri-add-line"></i> {isPriceMode ? '新增条目' : '新增图文/视频'}</button>
                                  {/* 智能批量导入按钮 */}
                                  <button onClick={()=>{setBatchImportTarget({type:'main', arrayName}); setShowBatchImportModal(true);}} className="text-xs bg-emerald-100 text-emerald-700 font-bold px-4 py-2 rounded-full shadow-sm hover:bg-emerald-200 transition-colors"><i className={batchBtnIcon}></i> {batchBtnLabel}</button>
                                  {isPriceMode && (
                                      <button onClick={handleClearDraft} className="text-xs bg-gray-200 text-gray-600 font-bold px-4 py-2 rounded-full shadow-sm hover:bg-gray-300 transition-colors" title="清除浏览器本地草稿（不会影响已保存内容）"><i className="ri-delete-back-2-line"></i> 清除草稿</button>
                                  )}
                              </div>
                          )}
                      </div>

                      {categories.length > 0 && (
                          <div className="flex justify-center items-center gap-3 mb-10 flex-wrap px-4 animate-fade-in">
                              <button
                                  onClick={() => setActiveFilters(p => ({...p, [arrayName]: 'All'}))}
                                  className={`px-5 py-2 rounded-full text-xs tracking-widest uppercase transition-all shadow-sm ${currentFilter === 'All' ? 'bg-[#313131] text-white font-bold scale-105' : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'}`}
                              >
                                  {currentLang === 'en' ? 'All' : '全部'}
                              </button>
                              {categories.map(c => (
                                  <button
                                      key={c}
                                      onClick={() => setActiveFilters(p => ({...p, [arrayName]: c}))}
                                      className={`px-5 py-2 rounded-full text-xs tracking-widest uppercase transition-all shadow-sm ${currentFilter === c ? 'bg-[#313131] text-white font-bold scale-105' : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'}`}
                                  >
                                      {currentLang === 'en' ? categoryMap[c] : c}
                                  </button>
                              ))}
                          </div>
                      )}
                      
                      <div className={isMasonry ? "masonry-grid" : "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"}>
                          {filteredList.map(item => {
                              const parsedVid = parseVideoUrl(item.vid);
                              return (
                              <div key={item.id} 
                                   draggable={isEditing && !item.isAggregated}
                                   onDragStart={(e) => !item.isAggregated && handleDragStart(e, item.id, arrayName)}
                                   onDragEnter={(e) => !item.isAggregated && handleDragEnter(e, item.id, arrayName)}
                                   onDragOver={(e) => e.preventDefault()}
                                   onDragEnd={handleDragEnd}
                                   className={`${isMasonry ? 'masonry-item rounded-sm bg-[#fcfaf8] border border-aman-border/50 p-0' : `flex flex-col ${getGridSpanClass(item.cardSize)}`} group cursor-pointer relative shadow-sm hover:shadow-md transition-all duration-300`} 
                                   onClick={() => { if(!isEditing){ const gUrls = filteredList.map(i=>i.img).filter(Boolean); isVideoMode && item.vid ? setPlayingVideo(item.vid) : (isMasonry ? openLightbox(gUrls, gUrls.indexOf(item.img)) : openDetail(item.sourceType || arrayName, item.sourceId || item.id)) } }}>
                                  
                                  {isEditing && item.isAggregated ? (
                                      <div className="absolute top-2 left-2 flex gap-1 z-30">
                                          <div className="bg-blue-500/90 text-white text-[10px] px-2 py-0.5 rounded shadow whitespace-nowrap">自动聚合</div>
                                      </div>
                                  ) : isEditing && (
                                      <div className="absolute top-2 left-2 flex gap-1 z-30">
                                          <div className="bg-black/50 text-white text-[10px] px-1.5 py-0.5 rounded flex items-center mr-1 cursor-grab" title="拖拽排序"><i className="ri-drag-move-2-fill"></i></div>
                                          {!isMasonry && !isPriceMode && <>
                                              <button onClick={(e) => {e.stopPropagation(); handleArrayEdit(arrayName, item.id, 'cardSize', 'small')}} className={`w-6 h-6 text-[10px] rounded flex items-center justify-center shadow transition-colors ${item.cardSize==='small'||!item.cardSize?'bg-blue-600 text-white font-bold':'bg-white text-black'}`}>S</button>
                                              <button onClick={(e) => {e.stopPropagation(); handleArrayEdit(arrayName, item.id, 'cardSize', 'medium')}} className={`w-6 h-6 text-[10px] rounded flex items-center justify-center shadow transition-colors ${item.cardSize==='medium'?'bg-blue-600 text-white font-bold':'bg-white text-black'}`}>M</button>
                                              <button onClick={(e) => {e.stopPropagation(); handleArrayEdit(arrayName, item.id, 'cardSize', 'large')}} className={`w-6 h-6 text-[10px] rounded flex items-center justify-center shadow transition-colors ${item.cardSize==='large'?'bg-blue-600 text-white font-bold':'bg-white text-black'}`}>L</button>
                                          </>}
                                      </div>
                                  )}

                                  {isEditing && !item.isAggregated && <button onClick={(e)=>{e.stopPropagation();handleRemoveArrayItem(arrayName, item.id)}} className="absolute top-2 right-2 bg-red-500 text-white w-6 h-6 flex items-center justify-center rounded z-20"><i className="ri-delete-bin-line text-xs"></i></button>}
                                  
                                  <div className={`w-full overflow-hidden relative bg-gray-100 img-hover-zoom ${isMasonry ? 'rounded-t-sm' : 'aspect-[4/3] rounded-sm mb-5'}`}>
                                      {isEditing && !item.isAggregated && (<input className="absolute inset-x-0 bottom-0 text-[10px] p-1 bg-white/90 z-10 w-full" placeholder="封面图片URL" value={item.img} onChange={e=>handleArrayEdit(arrayName,item.id,'img',e.target.value)} onClick={e=>e.stopPropagation()}/>)}
                                      
                                      {isVideoMode && item.vid ? (
                                          parsedVid.isIframe ? (
                                              <div className={`w-full h-full relative opacity-80 group-hover:opacity-100 transition-opacity ${!isMasonry?'aspect-video':''} group-hover:scale-105 duration-700`}>
                                                  {item.img ? (
                                                      <img src={item.img} className="w-full h-full object-cover" />
                                                  ) : (
                                                      <iframe src={parsedVid.url} className="w-full h-full border-0 pointer-events-none" allowFullScreen></iframe>
                                                  )}
                                              </div>
                                          ) : (
                                              <video src={parsedVid.url} poster={item.img} className={`w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity ${!isMasonry?'aspect-video':''}`} muted loop playsInline onMouseEnter={e=>{const p = e.target.play(); if(p!==undefined)p.catch(()=>{})}} onMouseLeave={e=>e.target.pause()}></video>
                                          )
                                      ) : (
                                          <img src={item.img} className="w-full h-full object-cover" />
                                      )}

                                      {isVideoMode && (!parsedVid.isIframe || item.img) && (
                                          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                              <div className="w-12 h-12 rounded-full border border-white/50 group-hover:bg-white group-hover:border-white flex items-center justify-center backdrop-blur-sm transition-all"><i className="ri-play-fill text-white group-hover:text-black ml-1 text-xl transition-colors"></i></div>
                                          </div>
                                      )}
                                      {isEditing && !item.isAggregated && isVideoMode && <input className="absolute inset-x-0 top-0 text-[10px] p-1 bg-white/90 z-10 w-full" placeholder="输入 MP4 或 B站链接/BV号" value={item.vid} onChange={e=>handleArrayEdit(arrayName,item.id,'vid',e.target.value)} onClick={e=>e.stopPropagation()}/>}
                                  </div>

                                  <div className={`${isMasonry ? 'p-5' : ''} flex-1 flex flex-col items-start w-full`}>
                                      {item.category && <EditableArrayText item={item} data={data} lang={currentLang} isEditing={isEditing && !item.isAggregated} onEdit={handleArrayEdit} arrayName={arrayName} field="category" tag="p" className="text-[10px] text-gray-400 mb-2 uppercase tracking-widest" />}
                                      <EditableArrayText item={item} data={data} lang={currentLang} isEditing={isEditing && !item.isAggregated} onEdit={handleArrayEdit} arrayName={arrayName} field="title" tag="h3" className="font-serif text-[#313131] text-lg mb-2 leading-snug w-full group-hover:text-blue-500 transition-colors" />
                                      {item.desc !== undefined && <EditableArrayText item={item} data={data} lang={currentLang} isEditing={isEditing && !item.isAggregated} onEdit={handleArrayEdit} arrayName={arrayName} field="desc" tag="p" className={`text-xs text-aman-muted leading-relaxed text-justify w-full ${!isMasonry?'line-clamp-3':''}`} />}
                                      {item.date && <p className="text-xs text-gray-500 mt-2">{item.date}</p>}
                                      {isPriceMode && (
                                          <div className="mt-2 w-full bg-[#313131] text-white px-3 py-2.5 rounded-sm">
                                              <div className="flex items-end justify-between gap-2">
                                                  <div className="text-right">
                                                      <div className="text-[9px] uppercase tracking-[0.2em] text-white/60">{currentLang==='en'?'Unit Price':'综合单价'}</div>
                                                      <div className="text-lg font-serif font-bold leading-tight"><span className="text-xs align-top mr-0.5 text-amber-300">¥</span>{(item.price!==undefined && item.price!=='' && item.price!==null) ? item.price : '—'}</div>
                                                  </div>
                                                  {item.unit ? <div className="text-[10px] text-white/70 pb-0.5 whitespace-nowrap">{currentLang==='en'?'Unit':'单位'}: {item.unit}</div> : null}
                                              </div>
                                          </div>
                                      )}
                                      {isEditing && !item.isAggregated && isPriceMode && (
                                          <div className="mt-2 w-full space-y-1">
                                              <div className="flex gap-1">
                                                  <input className="flex-1 min-w-0 p-1 text-[11px] border rounded outline-none focus:border-blue-500" placeholder={currentLang==='en'?'Unit Price':'单价(元)'} value={item.price||''} onChange={e=>handleArrayEdit(arrayName,item.id,'price',e.target.value)} onClick={e=>e.stopPropagation()} />
                                                  <input className="w-16 p-1 text-[11px] border rounded outline-none focus:border-blue-500" placeholder={currentLang==='en'?'Unit':'单位'} value={item.unit||''} onChange={e=>handleArrayEdit(arrayName,item.id,'unit',e.target.value)} onClick={e=>e.stopPropagation()} />
                                              </div>
                                              <input className="w-full p-1 text-[11px] border rounded outline-none focus:border-blue-500" placeholder={currentLang==='en'?'Spec/Material':'规格材质'} value={item.spec||''} onChange={e=>handleArrayEdit(arrayName,item.id,'spec',e.target.value)} onClick={e=>e.stopPropagation()} />
                                              <input className="w-full p-1 text-[11px] border rounded outline-none focus:border-blue-500" placeholder={currentLang==='en'?'Remark':'备注'} value={item.remark||''} onChange={e=>handleArrayEdit(arrayName,item.id,'remark',e.target.value)} onClick={e=>e.stopPropagation()} />
                                          </div>
                                      )}
                                      {isEditing && !isVideoMode && !isMasonry && !item.isAggregated && <button onClick={(e)=>{e.stopPropagation(); openDetail(arrayName, item.id);}} className="mt-4 text-xs bg-emerald-100 text-emerald-700 px-3 py-1 rounded w-full">编辑详情页深度内容</button>}
                                      {isEditing && !isVideoMode && !isMasonry && item.isAggregated && <button onClick={(e)=>{e.stopPropagation(); openDetail(item.sourceType, item.sourceId);}} className="mt-4 text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded w-full"><i className="ri-share-forward-line"></i> 前往原模块编辑</button>}
                                  </div>
                              </div>
                              );
                          })}
                      </div>
                  </div>
              );
          };

          const renderProcess = (menuId, title) => {
              const tabs = data.processTabs || [];
              const list = data[activeProcessTab] || [];
              const displayTitle = currentLang === 'en' ? (data.menus?.find(m=>m.id==='process')?.labelEn || title) : title;

              const handleAddProcessTab = () => {
                  const newId = 'process_' + Date.now();
                  setData(p => ({
                      ...p,
                      processTabs: [...(p.processTabs||[]), { id: newId, label: '新分类', labelEn: 'New Category' }],
                      [newId]: []
                  }));
                  setActiveProcessTab(newId);
              };

              const handleEditProcessTab = (id, field, val) => {
                  setData(p => ({
                      ...p,
                      processTabs: p.processTabs.map(t => t.id === id ? { ...t, [field]: val } : t)
                  }));
              };

              const handleRemoveProcessTab = (id) => {
                  setDialog({
                      type: 'confirm',
                      msg: '确定删除此分类及其所有流程节点吗？',
                      onConfirm: () => {
                          setData(p => {
                              let newData = { ...p };
                              newData.processTabs = newData.processTabs.filter(t => t.id !== id);
                              delete newData[id];
                              return newData;
                          });
                          if (activeProcessTab === id) setActiveProcessTab(tabs[0]?.id || '');
                          setDialog(null);
                      }
                  });
              };

              return (
                  <section className="animate-fade-in py-16 px-4 md:px-8 w-full text-center min-h-screen">
                      <div className="flex justify-center items-center gap-4 mb-10">
                          <h1 className="text-3xl font-serif tracking-widest text-[#313131]">{displayTitle}</h1>
                      </div>

                      {/* 聚合分类 Tabs */}
                      <div className="flex justify-center items-center mb-12 overflow-x-auto hide-scrollbar w-full px-2">
                          <div className="flex items-center bg-gray-50/50 p-1.5 rounded-full border border-gray-200 shadow-sm min-w-max">
                              {tabs.map(tab => (
                                  <div key={tab.id} className="relative group flex items-center shrink-0">
                                      {isEditing ? (
                                          <input
                                              className={`px-6 py-2 text-sm text-center outline-none bg-transparent rounded-full transition-all ${activeProcessTab === tab.id ? 'bg-white shadow font-bold text-black' : 'text-gray-500 hover:text-black'}`}
                                              value={currentLang === 'en' ? (tab.labelEn || tab.label) : tab.label}
                                              onClick={() => setActiveProcessTab(tab.id)}
                                              onChange={e => handleEditProcessTab(tab.id, currentLang === 'en' ? 'labelEn' : 'label', e.target.value)}
                                              onBlur={e => {
                                                  if (currentLang === 'cn' && window.__autoTranslateEnabled) {
                                                      autoTranslateField(e.target.value, (translated) => handleEditProcessTab(tab.id, 'labelEn', translated));
                                                  }
                                              }}
                                              style={{ width: '130px' }}
                                          />
                                      ) : (
                                          <button
                                              onClick={() => setActiveProcessTab(tab.id)}
                                              className={`px-6 py-2 text-sm whitespace-nowrap transition-all rounded-full ${activeProcessTab === tab.id ? 'bg-white shadow font-bold text-black' : 'text-gray-500 hover:text-black'}`}
                                          >
                                              {currentLang === 'en' ? (tab.labelEn || tab.label) : tab.label}
                                          </button>
                                      )}
                                      {isEditing && (
                                          <button onClick={(e)=>{e.stopPropagation(); handleRemoveProcessTab(tab.id)}} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 shadow"><i className="ri-close-line"></i></button>
                                      )}
                                  </div>
                              ))}
                              {isEditing && (
                                  <button onClick={handleAddProcessTab} className="px-4 py-2 text-xs text-blue-600 font-bold hover:bg-blue-50 rounded-full transition-colors whitespace-nowrap ml-1">
                                      + 添加分类
                                  </button>
                              )}
                          </div>
                      </div>
                      
                      <div className="mb-28 text-left mt-6">
                          {isEditing && activeProcessTab && (
                              <div className="text-center mb-8">
                                  <button onClick={()=>handleAddArrayItem(activeProcessTab, {title:'新节点', desc:'描述', img:''})} className="text-xs bg-blue-100 text-blue-600 px-5 py-2.5 rounded-full shadow-sm hover:bg-blue-200 transition-colors">
                                      <i className="ri-add-line mr-1"></i> 在【{tabs.find(t=>t.id===activeProcessTab)?.label}】下新增节点
                                  </button>
                              </div>
                          )}
                          <div className="flex flex-wrap justify-center gap-6">
                              {list.length === 0 ? (
                                  <div className="text-gray-400 text-sm tracking-widest py-10 w-full text-center">暂无流程节点内容</div>
                              ) : (
                                  list.map((step, idx) => (
                                      <div key={step.id} 
                                           draggable={isEditing}
                                           onDragStart={(e) => handleDragStart(e, step.id, activeProcessTab)}
                                           onDragEnter={(e) => handleDragEnter(e, step.id, activeProcessTab)}
                                           onDragOver={(e) => e.preventDefault()}
                                           onDragEnd={handleDragEnd}
                                           className="relative flex-1 min-w-[200px] max-w-[250px] group flex flex-col transition-transform duration-300">
                                          
                                          {isEditing && <div className="absolute top-2 left-2 bg-black/50 text-white text-[10px] px-1.5 py-0.5 rounded flex items-center z-30 cursor-grab" title="拖拽排序节点"><i className="ri-drag-move-2-fill"></i></div>}
                                          {isEditing && <button onClick={()=>handleRemoveArrayItem(activeProcessTab, step.id)} className="absolute top-2 right-2 bg-red-500 text-white w-5 h-5 flex items-center justify-center rounded z-30"><i className="ri-delete-bin-line text-xs"></i></button>}
                                          
                                          <div className="aspect-video bg-gray-100 mb-4 rounded-sm overflow-hidden relative">
                                              {isEditing && <input className="absolute inset-x-0 bottom-0 text-[10px] p-1 bg-white/90 z-10 w-full" placeholder="图片URL" value={step.img} onChange={e=>handleArrayEdit(activeProcessTab,step.id,'img',e.target.value)}/>}
                                              <img src={step.img} className="w-full h-full object-cover" />
                                          </div>
                                          <EditableArrayText item={step} data={data} lang={currentLang} isEditing={isEditing} onEdit={handleArrayEdit} arrayName={activeProcessTab} field="title" tag="h4" className="font-bold text-sm mb-2 text-[#313131] w-full" />
                                          <EditableArrayText item={step} data={data} lang={currentLang} isEditing={isEditing} onEdit={handleArrayEdit} arrayName={activeProcessTab} field="desc" tag="p" className="text-xs text-gray-500 w-full" />
                                          
                                          {idx < list.length - 1 && (
                                              <div className="hidden md:flex absolute top-[30%] -right-5 transform -translate-y-1/2 z-0 w-6 items-center justify-center">
                                                  <i className="ri-arrow-right-line text-2xl text-gray-300"></i>
                                              </div>
                                          )}
                                      </div>
                                  ))
                              )}
                          </div>
                      </div>
                  </section>
              );
          };

          // ===== 预估报价清单模板 =====
          // 数据存储于 data[quoteKey].quote（quoteKey 为菜单 id），随导出保留。
          // 条目来源：price 模板菜单(基装/材料/水电/植物/措施)中的 price 字段，后台可检索并批量加入。
          const renderQuote = (menuId) => {
              const quoteKey = 'quote' === menuId ? 'quote' : menuId;
              const qobj = data[quoteKey] || {};
              const q = qobj.quote || {};
              const quoteList = Array.isArray(q.rows) ? q.rows : [];
              const sections = Array.isArray(q.sections) && q.sections.length ? q.sections : ['A.打拆部分'];
              const srcMenuIds = ['jizhuang','materials','shuidian','plants','cuoshi'];
              const menuRef = data.menus?.find(m => m.id === menuId) || {label: '预估报价'};
              const displayTitle = currentLang === 'en' ? (menuRef.labelEn || 'Estimate') : menuRef.label;
              const fmt = (n) => (Number(n) || 0).toLocaleString('zh-CN');

              // 汇总所有价格目录条目供检索
              let catalogItems = [];
              srcMenuIds.forEach(mid => {
                  const srcM = data.menus?.find(m => m.id === mid);
                  const srcArr = data[mid] || [];
                  srcArr.forEach(it => {
                      const p = Number(it.price);
                      if (p > 0) {
                          catalogItems.push({
                              src: mid,
                              srcLabel: currentLang === 'en' ? (srcM?.labelEn || mid) : (srcM?.label || mid),
                              name: currentLang === 'en' ? (it.titleEn || it.title) : it.title,
                              unit: it.unit || '项',
                              price: p,
                              spec: it.spec || (it.desc && typeof it.desc === 'string' ? it.desc.slice(0, 60) : ''),
                              remark: it.remark || ''
                          });
                      }
                  });
              });
              const kw = (quoteKeyword || '').trim().toLowerCase();
              const srcFiltered = kw
                  ? catalogItems.filter(it => (it.srcLabel + it.name + it.spec + it.remark).toLowerCase().includes(kw))
                  : catalogItems;
              const sectionTotal = (rows) => rows.reduce((s, r) => s + ((Number(r.quantity) || 0) * (Number(r.price) || 0)), 0);
              const grandTotal = quoteList.reduce((s, r) => s + ((Number(r.quantity) || 0) * (Number(r.price) || 0)), 0);

              const handleQuote = (fn) => setData(p => {
                  const pk = 'quote' === menuId ? 'quote' : menuId;
                  const cur = (p[pk] && p[pk].quote) || {};
                  const next = { ...cur, ...fn({ ...cur, rows: (cur.rows || []).map(r => ({...r})) }, p) };
                  return { ...p, [pk]: { ...(p[pk] || {}), quote: next } };
              });

              // 头部文字写入 data[quoteKey].quote[field]，随导出保留
              const setHeader = (field, value) => setData(p => {
                  const pk = 'quote' === menuId ? 'quote' : menuId;
                  const cur = (p[pk] && p[pk].quote) || {};
                  return { ...p, [pk]: { ...(p[pk] || {}), quote: { ...cur, [field]: value } } };
              });

              const addRow = (sec, item) => {
                  const secName = sec || quoteActiveSection || sections[0];
                  handleQuote((cur) => ({
                      sections: sections,
                      rows: [...cur.rows, { id: 'q' + Date.now(), section: secName, name: item.name, unit: item.unit, quantity: 1, price: item.price, spec: item.spec, remark: item.remark, src: item.src }]
                  }));
                  setQuoteShowCatalog(false);
                  setQuoteActiveSection('');
                  if (window.__showToast) window.__showToast('✅ 已加入报价：' + (item.name || ''));
              };

              // ===== 报价导出：Excel(SheetJS) 与 PDF(html2canvas + jsPDF，中文兼容) =====
              const exportQuoteExcel = async () => {
                  if (!quoteList.length) { if (window.__showToast) window.__showToast('⚠️ 当前没有可导出的报价条目'); return; }
                  try {
                      await ensureLibOnce([XLSX_CDN]);
                      const XLSX = window.XLSX;
                      const aoa = [];
                      aoa.push([q.title || '景观工程报价清单']);
                      if (q.project) aoa.push(['项目名称', q.project]);
                      if (q.client) aoa.push(['客户名称', q.client]);
                      if (q.location) aoa.push(['施工地点', q.location]);
                      if (q.date) aoa.push(['报价日期', q.date]);
                      if (q.note) aoa.push(['说明/备注', q.note]);
                      aoa.push([]);
                      sections.forEach(sec => {
                          const rows = quoteList.filter(r => r.section === sec);
                          aoa.push([sec]);
                          aoa.push(['序号', '名称', '单位', '数量', '综合单价', '合计', '规格材质', '备注']);
                          rows.forEach((r, i) => {
                              const qty = Number(r.quantity) || 0, p = Number(r.price) || 0;
                              aoa.push([i + 1, r.name || '', r.unit || '', qty, p, qty * p, r.spec || '', r.remark || '']);
                          });
                          aoa.push(['', '', '', '', '小计', sectionTotal(rows), '', '']);
                      });
                      aoa.push(['', '', '', '', '总合计', grandTotal, '', '']);
                      const ws = XLSX.utils.aoa_to_sheet(aoa);
                      ws['!cols'] = [{ wch: 6 }, { wch: 26 }, { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 32 }, { wch: 16 }];
                      const wb = XLSX.utils.book_new();
                      XLSX.utils.book_append_sheet(wb, ws, '报价清单');
                      XLSX.writeFile(wb, ((q.project || '').replace(/[\\/:*?"<>|]/g, '_') ? (q.project + '_') : '') + '报价清单.xlsx');
                      if (window.__showToast) window.__showToast('✅ 已导出 Excel 报价表');
                  } catch (e) { console.error(e); if (window.__showToast) window.__showToast('❌ 导出 Excel 失败：' + e.message); }
              };
              const exportQuotePDF = async () => {
                  if (!quoteList.length) { if (window.__showToast) window.__showToast('⚠️ 当前没有可导出的报价条目'); return; }
                  try {
                      await ensureLibOnce([HTML2CANVAS_CDN, JSPDF_CDN]);
                      const html2canvas = window.html2canvas;
                      const { jsPDF } = window.jspdf;
                      const srcEl = document.getElementById('quoteSheet');
                      if (!srcEl) throw new Error('报价单区域不存在');
                      // 克隆到固定宽度渲染，保证 A4 版面整齐、中文由浏览器渲染无乱码
                      const clone = srcEl.cloneNode(true);
                      clone.style.width = '1200px';
                      clone.style.position = 'fixed';
                      clone.style.left = '-99999px';
                      clone.style.top = '0';
                      clone.style.background = '#ffffff';
                      clone.style.zIndex = '-1';
                      document.body.appendChild(clone);
                      try {
                          const canvas = await html2canvas(clone, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                          const pdf = new jsPDF('p', 'mm', 'a4');
                          const pageW = 210, pageH = 297;
                          const imgW = pageW - 20;
                          const imgH = canvas.height * imgW / canvas.width;
                          let printed = 0, firstPage = true;
                          while (printed < imgH) {
                              if (!firstPage) pdf.addPage();
                              firstPage = false;
                              const sliceH = Math.min(pageH - 20, imgH - printed);
                              const srcY = canvas.height * (printed / imgH);
                              const sliceSrcH = canvas.height * (sliceH / imgH);
                              pdf.addImage(canvas, 'PNG', 10, 10, imgW, sliceH, undefined, 'FAST', 0, srcY, sliceSrcH);
                              printed += sliceH;
                          }
                          pdf.save(((q.project || '').replace(/[\\/:*?"<>|]/g, '_') ? (q.project + '_') : '') + '报价清单.pdf');
                          if (window.__showToast) window.__showToast('✅ 已导出 PDF 报价表');
                      } finally {
                          document.body.removeChild(clone);
                      }
                  } catch (e) { console.error(e); if (window.__showToast) window.__showToast('❌ 导出 PDF 失败：' + e.message); }
              };

              return (
                  <div className="animate-fade-in py-10 px-4 md:px-8 w-full min-h-screen">
                      <style>{'#qtbl input{font-size:11px;}#qtbl{padding-bottom:60px;}'}</style>
                      {/* 顶部操作区 */}
                      <div className="flex flex-wrap justify-between items-center mb-6 gap-3">

                              <h1 className="text-3xl font-serif tracking-widest text-[#313131]">{displayTitle}</h1>
                              <p className="text-[10px] uppercase tracking-[0.3em] text-aman-muted mt-2">Estimate Quote Sheet</p>
                          </div>
                          <div className="flex gap-2 flex-wrap">
                              <button onClick={exportQuoteExcel} className="text-xs bg-emerald-600 text-white font-bold px-4 py-2 rounded-full shadow-sm hover:bg-emerald-700 transition-colors"><i className="ri-file-excel-2-line"></i> 导出表格</button>
                              <button onClick={exportQuotePDF} className="text-xs bg-red-600 text-white font-bold px-4 py-2 rounded-full shadow-sm hover:bg-red-700 transition-colors"><i className="ri-file-pdf-2-line"></i> 导出PDF</button>

                              {isEditing && (
                                  <button onClick={()=>{const v=quoteNewSection.trim(); if(!v) return; handleQuote((cur)=>({sections:[...(cur.sections||sections), v]})); setQuoteNewSection('');}} className="text-xs bg-emerald-100 text-emerald-700 font-bold px-4 py-2 rounded-full shadow-sm hover:bg-emerald-200 transition-colors"><i className="ri-add-line"></i> 添加分区</button>
                              )}
                          </div>
                      </div>

                      {/* 价格目录检索面板 */}
                      {quoteShowCatalog && (
                          <div className="bg-white/90 border border-aman-border/60 rounded-lg shadow-md p-4 mb-8">
                              <div className="flex items-center gap-2 mb-3 flex-wrap">
                                  <span className="text-xs font-bold text-gray-600"><i className="ri-price-tag-3-line text-blue-600"></i> 从 {currentLang === 'en' ? 'Price Catalogs' : '价格目录'} 检索加入：</span>
                                  <input className="flex-1 min-w-[180px] p-1.5 text-xs border rounded outline-none focus:border-blue-500" placeholder="输入名称 / 材质 / 备注 检索…" value={quoteKeyword} onChange={e=>setQuoteKeyword(e.target.value)} />
                                  <select className="p-1.5 text-xs border rounded" value={quoteActiveSection} onChange={e=>setQuoteActiveSection(e.target.value)}>
                                      <option value="">{currentLang==='en' ? 'Select section' : '选择加入分区（默认首区）'}</option>
                                      {sections.map(s => <option key={s} value={s}>{s}</option>)}
                                  </select>
                              </div>
                              <div className="max-h-64 overflow-y-auto custom-scrollbar border border-gray-100 rounded">
                                  {srcFiltered.length === 0 ? (
                                      <p className="text-xs text-gray-400 text-center py-6">{currentLang==='en' ? 'No price items found. Add price items in the price gallery menus first.' : '暂无价格条目，请先在 基装/材料/水电/植物/措施 菜单中添加带价格的条目。'}</p>
                                  ) : (
                                      <table id="qtbl" className="w-full text-left">
                                          <thead>
                                              <tr className="text-[10px] uppercase tracking-widest text-gray-400 border-b border-gray-100">
                                                  <th className="p-2 w-24">{currentLang==='en'?'Source':'来源'}</th>
                                                  <th className="p-2">{currentLang==='en'?'Name':'名称'}</th>
                                                  <th className="p-2 w-16">{currentLang==='en'?'Unit':'单位'}</th>
                                                  <th className="p-2 w-24 text-right">{currentLang==='en'?'Price':'价格'}</th>
                                                  <th className="p-2 w-20"></th>
                                              </tr>
                                          </thead>
                                          <tbody>
                                              {srcFiltered.map((it, i) => (
                                                  <tr key={i} className="border-b border-gray-50 hover:bg-blue-50/60">
                                                      <td className="p-2 text-[10px] text-gray-400">{it.srcLabel}</td>
                                                      <td className="p-2 text-xs">{it.name}<div className="text-[10px] text-gray-400">{it.spec}</div></td>
                                                      <td className="p-2 text-xs text-gray-500">{it.unit}</td>
                                                      <td className="p-2 text-xs text-right font-bold text-[#313131]">¥{fmt(it.price)}</td>
                                                      <td className="p-2 text-right"><button onClick={()=>addRow('', it)} className="text-[10px] bg-blue-600 text-white px-2.5 py-1 rounded hover:bg-blue-700 font-bold">加入</button></td>
                                                  </tr>
                                              ))}
                                          </tbody>
                                      </table>
                                  )}
                              </div>
                              <p className="text-[10px] text-gray-400 mt-2">{currentLang==='en' ? 'Items come from the price field of gallery menus. Price/quantity can be edited in the table below.' : '条目取自各价格图集菜单的“价格”字段；加入后可继续在下方表格内调整数量、单价、规格与备注。'}</p>
                          </div>
                      )}

                      {/* 报价单主体 */}
                      <div id="quoteSheet" className="bg-white shadow-lg border border-aman-border/50 rounded-lg overflow-hidden">
                          {/* 大标题 + 头部信息 */}
                          <div className="text-center py-6 border-b border-gray-200">
                              {isEditing
                                  ? <input className="w-full max-w-2xl mx-auto text-center p-2 text-2xl font-serif border rounded outline-none focus:border-blue-500" placeholder="景观工程报价清单" value={q.title || ''} onChange={e=>setHeader('title', e.target.value)} />
                                  : <span className="text-2xl font-serif tracking-[0.2em] text-[#313131]">{q.title || '景观工程报价清单'}</span>}
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-2 mt-5 max-w-2xl mx-auto text-sm">
                                  {[['project', '项目名称', 'Project Name'], ['client', '客户名称', 'Client'], ['location', '施工地点', 'Location'], ['date', '报价日期', 'Date']].map(([dk, cn, en]) => (
                                      <div key={dk} className="flex items-center gap-2 px-2">
                                          <span className="text-gray-500 font-bold whitespace-nowrap">{currentLang==='en' ? en : cn}：</span>
                                          {isEditing
                                              ? <input className="flex-1 min-w-0 p-1 text-sm border rounded outline-none focus:border-blue-500" value={q[dk] || ''} placeholder={currentLang==='en' ? en : cn} onChange={e=>setHeader(dk, e.target.value)} />
                                              : <span className="flex-1 min-w-0">{q[dk] || ''}</span>}
                                      </div>
                                  ))}
                              </div>
                              <div className="mt-3 max-w-2xl mx-auto px-2 text-sm flex items-center gap-2">
                                  <span className="text-gray-500 font-bold whitespace-nowrap">{currentLang==='en' ? 'Note' : '说明/备注'}：</span>
                                  {isEditing
                                      ? <input className="flex-1 min-w-0 p-1 text-sm border rounded outline-none focus:border-blue-500" value={q.note || ''} placeholder={currentLang==='en' ? 'Note' : '说明/备注'} onChange={e=>setHeader('note', e.target.value)} />
                                      : <span className="flex-1 min-w-0 text-gray-600">{q.note || ''}</span>}
                              </div>
                          </div>

                          {/* 分区表格 */}
                          {sections.map((sec, si) => {
                              const rows = quoteList.filter(r => r.section === sec);
                              const st = sectionTotal(rows);
                              return (
                                  <div key={si}>
                                      {si > 0 && <div className="border-t border-gray-200"></div>}
                                      <div className="flex items-center justify-between px-4 py-2 bg-[#f3eee7]">
                                          <span className="text-sm font-serif font-bold tracking-widest text-[#313131]">{sec}</span>
                                          {isEditing && (
                                              <div className="flex items-center gap-1">
                                                  <button onClick={()=>handleQuote((cur)=>({sections:(cur.sections||sections), rows:[...(cur.rows||[]), {id:'q'+Date.now(), section:sec, name:'', unit:'项', quantity:1, price:0, spec:'', remark:'', src:''}]}))} className="text-[10px] bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700"><i className="ri-add-line"></i> {currentLang==='en'?'Add row':'新增行'}</button>
                                                  {sections.length > 1 && (
                                                      <button onClick={()=>handleQuote((cur)=>({sections:(cur.sections||sections).filter(s=>s!==sec), rows:(cur.rows||[]).filter(r=>r.section!==sec)}))} className="text-[10px] bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"><i className="ri-delete-bin-line"></i></button>
                                                  )}
                                              </div>
                                          )}
                                      </div>
                                      <table id="qtbl" className="w-full text-left">
                                          <thead>
                                              <tr className="text-[10px] uppercase tracking-widest text-gray-400 bg-gray-50 border-b border-gray-100">
                                                  <th className="p-2 w-12">{currentLang==='en'?'No':'序号'}</th>
                                                  <th className="p-2">{currentLang==='en'?'Name':'名称'}</th>
                                                  <th className="p-2 w-16">{currentLang==='en'?'Unit':'单位'}</th>
                                                  <th className="p-2 w-20 text-right">{currentLang==='en'?'Qty':'数量'}</th>
                                                  <th className="p-2 w-24 text-right">{currentLang==='en'?'Price':'综合单价'}</th>
                                                  <th className="p-2 w-24 text-right">{currentLang==='en'?'Total':'合计'}</th>
                                                  <th className="p-2">{currentLang==='en'?'Spec & Material':'规格材质'}</th>
                                                  <th className="p-2 w-28">{currentLang==='en'?'Remark':'备注'}</th>
                                                  {isEditing && <th className="p-2 w-10"></th>}
                                              </tr>
                                          </thead>
                                          <tbody>
                                              {rows.length === 0 && (
                                                  <tr><td colSpan={isEditing ? 9 : 8} className="p-4 text-center text-xs text-gray-400">{currentLang==='en' ? 'No items in this section yet.' : '本分区暂无条目，可通过「价格目录检索」加入或点「新增行」手工添加。'}</td></tr>
                                              )}
                                              {rows.map(r => {
                                                  const lineTotal = (Number(r.quantity) || 0) * (Number(r.price) || 0);
                                                  const edit = (f, v) => handleQuote((cur)=>({rows: (cur.rows||[]).map(x => x.id === r.id ? {...x, [f]: v} : x)}));
                                                  return (
                                                      <tr key={r.id} className="border-b border-gray-50 align-top hover:bg-gray-50/60">
                                                          <td className="p-2 text-xs text-gray-500">{rows.indexOf(r) + 1}</td>
                                                          <td className="p-2">
                                                              {isEditing
                                                                  ? <input className="w-full min-w-[140px] p-1 text-xs border rounded outline-none focus:border-blue-500" value={r.name || ''} placeholder="名称" onChange={e=>edit('name', e.target.value)} onClick={e=>e.stopPropagation()} />
                                                                  : <span className="text-xs">{r.name}</span>}
                                                          </td>
                                                          <td className="p-2">
                                                              {isEditing
                                                                  ? <input className="w-14 p-1 border rounded" value={r.unit || ''} onChange={e=>edit('unit', e.target.value)} onClick={e=>e.stopPropagation()} />
                                                                  : <span className="text-xs text-gray-500">{r.unit}</span>}
                                                          </td>
                                                          <td className="p-2 text-right">
                                                              <input type="number" min="0" step="any" className="w-20 p-1 text-right border rounded" value={r.quantity ?? 1} onChange={e=>edit('quantity', e.target.value)} onClick={e=>e.stopPropagation()} />
                                                          </td>
                                                          <td className="p-2 text-right">
                                                              <input type="number" min="0" step="any" className="w-24 p-1 text-right border rounded" value={r.price ?? 0} onChange={e=>edit('price', e.target.value)} onClick={e=>e.stopPropagation()} />
                                                          </td>
                                                          <td className="p-2 text-right font-bold text-[#313131]">¥{fmt(lineTotal)}</td>
                                                          <td className="p-2">
                                                              {isEditing
                                                                  ? <textarea rows="2" className="w-full p-1 border rounded text-[11px]" value={r.spec || ''} onChange={e=>edit('spec', e.target.value)} onClick={e=>e.stopPropagation()} />
                                                                  : <span className="text-xs text-gray-600 whitespace-pre-line">{r.spec}</span>}
                                                          </td>
                                                          <td className="p-2">
                                                              {isEditing
                                                                  ? <input className="w-full p-1 border rounded text-[11px]" value={r.remark || ''} onChange={e=>edit('remark', e.target.value)} onClick={e=>e.stopPropagation()} />
                                                                  : <span className="text-xs text-gray-500">{r.remark}</span>}
                                                          </td>
                                                          {isEditing && (
                                                              <td className="p-2 text-center">
                                                                  <button onClick={()=>handleQuote((cur)=>({rows:(cur.rows||[]).filter(x=>x.id!==r.id)}))} className="text-red-400 hover:text-red-600"><i className="ri-delete-bin-line"></i></button>
                                                              </td>
                                                          )}
                                                      </tr>
                                                  );
                                              })}
                                              <tr className="bg-[#f3eee7]">
                                                  <td colSpan={4}></td>
                                                  <td className="p-2 text-right text-xs font-bold text-[#313131]">小计</td>
                                                  <td className="p-2 text-right text-xs font-bold text-[#313131]">¥{fmt(st)}</td>
                                                  <td colSpan={isEditing ? 3 : 2}></td>
                                              </tr>
                                          </tbody>
                                      </table>
                                  </div>
                              );
                          })}

                          {/* 总合计 */}
                          <div className="flex items-center justify-end px-6 py-4 bg-white border-t border-gray-200 gap-3">
                              <span className="text-sm font-serif font-bold tracking-widest text-[#313131]">{currentLang==='en' ? 'GRAND TOTAL' : '总合计'}</span>
                              <span className="text-xl font-bold text-[#313131]">¥{fmt(grandTotal)}</span>
                          </div>
                      </div>
                  </div>
              );
          };

          const renderDetail = () => {
              if (!activeDetail) return null;
              const { type, id } = activeDetail;
              const item = data[type]?.find(i => i.id === id);
              if (!item) return null;

              return (
                  <article className="animate-fade-in w-full px-4 md:px-8 py-10 min-h-screen">
                      <button onClick={()=>setCurrentRoute(type)} className="mb-10 text-aman-muted hover:text-black flex items-center gap-1 text-sm"><i className="ri-arrow-left-line"></i> {currentLang === 'en' ? data.uiTexts?.backBtnEn || 'Back' : data.uiTexts?.backBtn || '返回'}</button>
                      <div className="text-center mb-12 border-b border-aman-border/30 pb-10">

                          <EditableArrayText item={item} data={data} lang={currentLang} isEditing={isEditing} onEdit={handleArrayEdit} arrayName={type} field="title" tag="h1" className="text-4xl font-serif text-[#313131] mb-8 leading-tight w-full" />
                          <EditableArrayText item={item} data={data} lang={currentLang} isEditing={isEditing} onEdit={handleArrayEdit} arrayName={type} field="desc" tag="p" className="text-sm text-aman-muted leading-relaxed max-w-3xl mx-auto text-justify md:text-center" />
                      </div>

                      <div className="mooool-content flex flex-wrap w-full gap-8">
                          {(item.media || []).map((m, idx) => {
                              const panoMode = m.panoMode || (m.isIframe === false ? 'link' : 'iframe');

                              return (
                              <div key={m.id} 
                                   draggable={isEditing}
                                   onDragStart={(e) => handleDragStartMedia(e, type, item.id, m.id)}
                                   onDragEnter={(e) => handleDragEnterMedia(e, type, item.id, m.id)}
                                   onDragOver={(e) => e.preventDefault()}
                                   onDragEnd={handleDragEndMedia}
                                   className={`relative group transition-all duration-300 ${getMediaWidthClass(m.cardSize)} ${isEditing ? 'border border-dashed border-gray-300 p-2 pt-10 rounded bg-gray-50/30' : ''}`}>
                                  
                                  {isEditing && (
                                      <div className="absolute top-2 left-2 flex gap-1 z-50">
                                          <div className="bg-black/50 text-white text-[10px] px-1.5 py-0.5 rounded flex items-center cursor-grab" title="拖拽排序区块"><i className="ri-drag-move-2-fill"></i></div>
                                          <button onClick={(e) => {e.stopPropagation(); handleUpdateMedia(type, item.id, m.id, 'cardSize', 'small')}} className={`w-5 h-5 text-[9px] rounded flex items-center justify-center shadow transition-colors ${m.cardSize==='small'?'bg-blue-600 text-white font-bold':'bg-white text-black'}`}>S</button>
                                          <button onClick={(e) => {e.stopPropagation(); handleUpdateMedia(type, item.id, m.id, 'cardSize', 'medium')}} className={`w-5 h-5 text-[9px] rounded flex items-center justify-center shadow transition-colors ${m.cardSize==='medium'?'bg-blue-600 text-white font-bold':'bg-white text-black'}`}>M</button>
                                          <button onClick={(e) => {e.stopPropagation(); handleUpdateMedia(type, item.id, m.id, 'cardSize', 'large')}} className={`w-5 h-5 text-[9px] rounded flex items-center justify-center shadow transition-colors ${m.cardSize==='large'||!m.cardSize?'bg-blue-600 text-white font-bold':'bg-white text-black'}`}>L</button>
                                          <button onClick={(e) => {e.stopPropagation(); handleRemoveMedia(type, item.id, m.id)}} className="w-5 h-5 text-[9px] bg-red-500 text-white rounded flex items-center justify-center shadow hover:bg-red-600 ml-1"><i className="ri-delete-bin-line text-xs"></i></button>
                                      </div>
                                  )}
                                  
                                  {m.type === 'text' && (
                                      isEditing ? 
                                      <textarea className="w-full p-4 border rounded min-h-[150px] outline-none focus:border-blue-500 bg-white" value={m.content} onChange={e=>handleUpdateMedia(type, item.id, m.id, 'content', e.target.value)} placeholder="输入段落正文..." onClick={e=>e.stopPropagation()} />
                                      : <p className="!mb-0 h-full">{m.content}</p>

                                  {m.type === 'image' && (

{ t: 'pandas_getDataResult', id: 'req1', ok: true, scope, data, time }
