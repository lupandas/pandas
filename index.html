, 'style', 'manual', 'video'];\n  modes.forEach(k => {\n    const btn = document.getElementById('btn-'+k);\n    if(btn) btn.classList.toggle('active', k===m);\n    \n    const panel = document.getElementById('panel-'+k);\n    if(panel) panel.classList.toggle('hidden', k!==m);\n  });\n\n  const titles = { chat:'AI 对话', ai:'专业生图', style:'图生图 (风格迁移)', manual:'手动摄影生图', video:'AI 视频生成' };\n  const icons  = { chat:'fa-message', ai:'fa-bolt', style:'fa-wand-sparkles', manual:'fa-sliders', video:'fa-film' };\n  \n  document.getElementById('cfg-title').textContent = titles[m];\n  document.getElementById('canvas-badge').innerHTML = `\u003ci class=\"fa-solid ${icons[m]}\">\u003c/i> ${titles[m]}`;\n    \n  const globalPrompt = document.getElementById('cfg-prompt');\n  if(globalPrompt) {\n    globalPrompt.style.display = (m === 'ai' || m === 'manual') ? 'block' : 'none';\n    if(m === 'ai' || m === 'manual') generatePrompt();\n  }\n\n  // Manage Canvas Area Visibility\n  const cChat = document.getElementById('canvas-chat');\n  const cMedia = document.getElementById('canvas-media');\n  if (m === 'chat') {\n      cChat.classList.remove('hidden');\n      cMedia.classList.add('hidden');\n  } else {\n      cChat.classList.add('hidden');\n      cMedia.classList.remove('hidden');\n  }\n}\n\n// ============================================================================\n// Prompt Generation (for Image Modes)\n// ============================================================================\nfunction setupChips() {\n  document.querySelectorAll('.chip[data-g]').forEach(c => {\n    c.addEventListener('click', () => {\n      if (c.classList.contains('more')) return;\n      const g = c.dataset.g;\n      if (g.endsWith('-atm')) { c.classList.toggle('on'); } // multi-select\n      else {\n        document.querySelectorAll(`.chip[data-g=\"${g}\"]`).forEach(x => x.classList.remove('on'));\n        c.classList.add('on');\n      }\n      generatePrompt();\n    });\n  });\n}\n\nfunction toggleMore(id) {\n    document.getElementById(id).classList.toggle('hidden');\n}\n\nfunction setScene(btn) {\n  document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('on'));\n  btn.classList.add('on');\n  generatePrompt();\n}\n\nfunction onCustomInput() { generatePrompt(); }\n\nfunction generatePrompt() {\n  if (S.mode !== 'ai' && S.mode !== 'manual') return;\n  const panel = document.getElementById(`panel-${S.mode}`);\n  if (!panel) return;\n  \n  let promptParts = [];\n\n  if (S.mode === 'manual') {\n    const activeScene = document.querySelector('.scene-btn.on');\n    if (activeScene) promptParts.push(activeScene.innerText.trim());\n  }\n\n  const activeChips = panel.querySelectorAll('.chip.on');\n  const customInputs = panel.querySelectorAll('.custom-input');\n  const noteStr = document.getElementById(S.mode === 'ai' ? 'ai-note' : 'm-note');\n\n  activeChips.forEach(chip => promptParts.push(chip.innerText.trim()));\n  customInputs.forEach(input => { if (input.value.trim()) promptParts.push(input.value.trim()); });\n  if (noteStr && noteStr.value.trim()) promptParts.push(noteStr.value.trim());\n\n  const finalPrompt = promptParts.join(', ');\n  const promptEl = document.getElementById('global-full-prompt');\n  if (promptEl) promptEl.value = finalPrompt;\n}\n\n// ============================================================================\n// Image Upload Handlers\n// ============================================================================\nfunction handleMainUpload(input) {\n  if (!input.files[0]) return;\n  const r = new FileReader();\n  r.onload = e => {\n    S.imgBase = e.target.result;\n    document.getElementById('canvas-hero').classList.add('hidden');\n    document.getElementById('main-upz').classList.remove('hidden');\n    const prev = document.getElementById('main-prev');\n    prev.src = S.imgBase; prev.classList.remove('hidden');\n    document.getElementById('main-ph').classList.add('hidden');\n    document.getElementById('main-rm').classList.remove('hidden');\n    toast('基础底图就绪', 'ok');\n  };\n  r.readAsDataURL(input.files[0]);\n}\n\nfunction rmMain(e) {\n  if(e) e.stopPropagation(); S.imgBase = null;\n  const prev = document.getElementById('main-prev'); prev.src = ''; prev.classList.add('hidden');\n  document.getElementById('main-ph').classList.remove('hidden');\n  document.getElementById('main-rm').classList.add('hidden');\n  document.getElementById('canvas-hero').classList.remove('hidden');\n  document.getElementById('main-upz').classList.add('hidden');\n  document.getElementById('main-file').value = '';\n}\n\nfunction handleRefUpload(input) {\n  if (!input.files[0]) return;\n  const r = new FileReader();\n  r.onload = e => {\n    S.imgRef = e.target.result;\n    const prev = document.getElementById('ref-prev');\n    prev.src = S.imgRef; prev.classList.remove('hidden');\n    document.getElementById('ref-ph').classList.add('hidden');\n  };\n  r.readAsDataURL(input.files[0]);\n}\nfunction rmRef(e) {\n  if(e) e.stopPropagation(); S.imgRef = null;\n  const prev = document.getElementById('ref-prev'); prev.src = ''; prev.classList.add('hidden');\n  document.getElementById('ref-ph').classList.remove('hidden');\n  document.getElementById('ref-file').value = '';\n}\n\nfunction setVideoType(t) {\n    const isText = (t === 'text2video');\n    document.getElementById('btn-vmode-text').className = isText ? 'flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-white text-blue shadow-sm' : 'flex-1 py-2 rounded-lg text-xs font-medium transition-all text-text3 hover:text-text';\n    document.getElementById('btn-vmode-img').className = !isText ? 'flex-1 py-2 rounded-lg text-xs font-bold transition-all bg-white text-blue shadow-sm' : 'flex-1 py-2 rounded-lg text-xs font-medium transition-all text-text3 hover:text-text';\n    document.getElementById('video-img-zone').classList.toggle('hidden', isText);\n}\nfunction handleVideoUpload(input) {\n  if (!input.files[0]) return;\n  const r = new FileReader();\n  r.onload = e => {\n    S.vidImg = e.target.result;\n    const prev = document.getElementById('vid-prev');\n    prev.src = S.vidImg; prev.classList.remove('hidden');\n    document.getElementById('vid-ph').classList.add('hidden');\n  };\n  r.readAsDataURL(input.files[0]);\n}\nfunction rmVideoImg(e) {\n  if(e) e.stopPropagation(); S.vidImg = null;\n  const prev = document.getElementById('vid-prev'); prev.src = ''; prev.classList.add('hidden');\n  document.getElementById('vid-ph').classList.remove('hidden');\n  document.getElementById('vid-file').value = '';\n}\n\n\n// ============================================================================\n// Core Generation & API Logic\n// ============================================================================\nwindow.keyIndices = { global: 0, chat: 0, image: 0, video: 0 };\n\nfunction getSysConfig() {\n    if (window.APP_ENV) return window.APP_ENV;\n    const saved = localStorage.getItem('pandas_admin_config');\n    if (saved) { try { return JSON.parse(saved); } catch(e){} }\n    return null;\n}\n\nfunction getApiConfig(type) {\n    const sys = getSysConfig();\n    if (!sys || !sys.global) { toast(\"未检测到 API 配置，请连续点击 Logo 5次进入后台配置。\", \"error\"); return null; }\n\n    let pool = [], url = '', pType = type, extra = {};\n    if (sys[type] && sys[type].enable) {\n        pool = sys[type].keys; url = sys[type].url; \n        try { extra = sys[type].extra ? JSON.parse(sys[type].extra) : {}; } catch(e){}\n    }\n    if (pool.length === 0) { pool = sys.global.keys; pType = 'global'; }\n    if (!url) url = sys.global.url || \"https://apihub.agnes-ai.com/v1\";\n    if (Object.keys(extra).length === 0 && sys.global.extra) {\n        try { extra = JSON.parse(sys.global.extra); } catch(e){}\n    }\n\n    if (!pool || pool.length === 0) { toast(`通道 [${type}] 未配置 API Key`, \"error\"); return null; }\n    const idx = window.keyIndices[pType] % pool.length; window.keyIndices[pType]++;\n    return { apiKey: pool[idx], baseUrl: url, extraParams: extra };\n}\n\nfunction escapeHTML(str) { return str.replace(/[&\u003c>'\"]/g, t => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', \"'\": '&#39;', '\"': '&quot;' }[t])); }\n\n/* --- Chat --- */\nfunction clearChat() {\n    S.chatHistory = [];\n    document.getElementById('chatHistory').innerHTML = `\n        \u003cdiv class=\"chat-msg bot\">\n            \u003cdiv class=\"chat-avatar\">\u003ci class=\"fa-solid fa-robot\">\u003c/i>\u003c/div>\n            \u003cdiv class=\"chat-bubble\">对话已清空，我们可以重新开始。\u003c/div>\n        \u003c/div>`;\n}\n\nasync function generateChat() {\n    const config = getApiConfig('chat'); if (!config) return;\n    const inputEl = document.getElementById('chatInput');\n    const prompt = inputEl.value.trim(); if (!prompt) return;\n    const model = document.getElementById('chatModel').value;\n    const btn = document.getElementById('btnSendChat');\n    const hist = document.getElementById('chatHistory');\n\n    S.chatHistory.push({ role: \"user\", content: prompt });\n    \n    hist.insertAdjacentHTML('beforeend', `\n        \u003cdiv class=\"chat-msg user\">\n            \u003cdiv class=\"chat-avatar\">\u003ci class=\"fa-solid fa-user\">\u003c/i>\u003c/div>\n            \u003cdiv class=\"chat-bubble\">${escapeHTML(prompt)}\u003c/div>\n        \u003c/div>\n    `);\n    inputEl.value = ''; btn.disabled = true; inputEl.disabled = true;\n    btn.innerHTML = `\u003cdiv class=\"loader loader-white\">\u003c/div>`;\n    hist.scrollTop = hist.scrollHeight;\n\n    const replyId = 'chat-rep-' + Date.now();\n    hist.insertAdjacentHTML('beforeend', `\n        \u003cdiv class=\"chat-msg bot\">\n            \u003cdiv class=\"chat-avatar\">\u003ci class=\"fa-solid fa-robot\">\u003c/i>\u003c/div>\n            \u003cdiv id=\"${replyId}\" class=\"chat-bubble\">\u003cspan class=\"inline-block w-1.5 h-4 bg-blue animate-pulse align-middle\">\u003c/span>\u003c/div>\n        \u003c/div>\n    `);\n    hist.scrollTop = hist.scrollHeight;\n\n    try {\n        const payload = { model: model, messages: S.chatHistory, stream: true };\n        Object.assign(payload, config.extraParams);\n\n        const res = await fetch(`${config.baseUrl}/chat/completions`, {\n            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },\n            body: JSON.stringify(payload)\n        });\n        if (!res.ok) throw new Error(`HTTP ${res.status}`);\n\n        const reader = res.body.getReader(); const decoder = new TextDecoder();\n        let buffer = '', fullReply = ''; const targetEl = document.getElementById(replyId);\n\n        while (true) {\n            const { done, value } = await reader.read();\n            if (done) break;\n            buffer += decoder.decode(value, { stream: true });\n            const lines = buffer.split('\\n'); buffer = lines.pop();\n            for (const line of lines) {\n                const trimmed = line.trim();\n                if (!trimmed || !trimmed.startsWith('data: ')) continue;\n                const dataStr = trimmed.slice(6);\n                if (dataStr === '[DONE]') break;\n                try {\n                    const parsed = JSON.parse(dataStr);\n                    const chunk = parsed.choices?.[0]?.delta?.content || '';\n                    if (chunk) { fullReply += chunk; targetEl.innerHTML = escapeHTML(fullReply) + '\u003cspan class=\"inline-block w-1.5 h-4 bg-blue animate-pulse align-middle ml-1\">\u003c/span>'; hist.scrollTop = hist.scrollHeight; }\n                } catch(e){}\n            }\n        }\n        targetEl.innerHTML = escapeHTML(fullReply);\n        S.chatHistory.push({ role: \"assistant\", content: fullReply });\n    } catch (err) {\n        document.getElementById(replyId).innerHTML = `\u003cspan style=\"color:var(--red)\">请求错误: ${err.message}\u003c/span>`;\n    } finally {\n        btn.disabled = false; inputEl.disabled = false;\n        btn.innerHTML = `\u003ci class=\"fa-solid fa-paper-plane\">\u003c/i>`;\n        hist.scrollTop = hist.scrollHeight; inputEl.focus();\n    }\n}\n\n/* --- Image Mapping Utils --- */\nfunction getPixelSize(quality, ratioVal) {\n    let longEdge = quality === '1k' ? 1024 : (quality === '2k' ? 2048 : 4096);\n    let fw = 1024, fh = 1024;\n    \n    // 如果没有底图且选了keep_base，强制回退 16:9\n    if (ratioVal === 'keep_base' && !S.imgBase) ratioVal = '16:9';\n\n    if (ratioVal === 'keep_base' && S.imgBase) {\n        return new Promise((resolve) => {\n            const img = new Image();\n            img.onload = () => {\n                const r = img.width / img.height;\n                if (img.width >= img.height) { fw = longEdge; fh = Math.round(longEdge / r); } \n                else { fh = longEdge; fw = Math.round(longEdge * r); }\n                resolve(`${Math.round(fw/8)*8}x${Math.round(fh/8)*8}`);\n            };\n            img.src = S.imgBase;\n        });\n    }\n\n    const ratioMap = { '16:9': 16/9, '4:3': 4/3, '1:1': 1, '9:16': 9/16, '3:4': 3/4 };\n    const r = ratioMap[ratioVal] || 16/9;\n    \n    if (r >= 1) { fw = longEdge; fh = Math.round(longEdge / r); }\n    else { fh = longEdge; fw = Math.round(longEdge * r); }\n    \n    return Promise.resolve(`${Math.round(fw/8)*8}x${Math.round(fh/8)*8}`);\n}\n\nasync function startImageRender(modeType) {\n    const config = getApiConfig('image'); if (!config) return;\n    \n    let prompt = '', model = '', qual = '1k', ratio = '16:9';\n    let btnId = '';\n    let isImg2Img = (modeType === 'style');\n\n    if (modeType === 'ai' || modeType === 'manual') {\n        prompt = document.getElementById('global-full-prompt').value.trim();\n        model = document.getElementById(modeType === 'ai' ? 'ai-engine' : 'm-engine').value;\n        qual = document.getElementById(modeType === 'ai' ? 'ai-res' : 'm-res').value;\n        ratio = document.getElementById(modeType === 'ai' ? 'ai-ratio' : 'm-ratio').value;\n        btnId = modeType === 'ai' ? 'ai-render-btn' : 'm-render-btn';\n    } else if (modeType === 'style') {\n        if (!S.imgBase) { toast('图生图必须在右侧画布上传基础底图', 'warn'); return; }\n        if (!S.imgRef) { toast('请上传风格参考图', 'warn'); return; }\n        \n        let stCustom = document.getElementById('st-prompt')?.value.trim();\n        prompt = stCustom ? stCustom + \", perfectly merge the style of reference image with the base image.\" : \"Merge the style of reference image with the base image perfectly.\";\n        \n        model = document.getElementById('st-engine').value;\n        qual = document.getElementById('st-res').value;\n        ratio = document.getElementById('st-ratio').value;\n        btnId = 'st-render-btn';\n    }\n    \n    if (!prompt && !isImg2Img) { toast('未生成提示词', 'warn'); return; }\n\n    const btn = document.getElementById(btnId);\n    const origHtml = btn.innerHTML;\n    btn.disabled = true; btn.innerHTML = `\u003cdiv class=\"loader\">\u003c/div> 提交渲染中...`;\n\n    const sizeStr = await getPixelSize(qual, ratio);\n    const cardId = 'card-' + Date.now();\n    const grid = document.getElementById('res-grid');\n    \n    grid.insertAdjacentHTML('afterbegin', `\n        \u003cdiv id=\"${cardId}\" class=\"res-card p-4 flex-col gap-3\">\n            \u003cdiv class=\"loader\">\u003c/div>\n            \u003cdiv id=\"stat-${cardId}\" class=\"text-xs font-bold text-blue tracking-wide\">正在请求 ${sizeStr}\u003c/div>\n        \u003c/div>\n    `);\n\n    try {\n        const payload = { model: model, prompt: prompt, size: sizeStr, extra_body: {response_format:'url'} };\n        if (isImg2Img) payload.extra_body.image = [S.imgBase, S.imgRef];\n        Object.assign(payload, config.extraParams);\n\n        let finalUrl = null;\n        for (let i = 0; i \u003c= 3; i++) {\n            try {\n                if (i > 0) document.getElementById(`stat-${cardId}`).innerText = `队列拥挤, 第 ${i} 次重试...`;\n                const res = await fetch(`${config.baseUrl}/images/generations`, { \n                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` }, \n                    body: JSON.stringify(payload) \n                });\n                const data = await res.json();\n                const errorMsg = data.error?.message || data.error || data.msg;\n                if (!res.ok || errorMsg) {\n                    const errStr = String(errorMsg || `HTTP ${res.status}`);\n                    if ((errStr.includes(\"queue\") || errStr.includes(\"retry\") || res.status===429 || res.status===503) && i\u003c3) { await sleep(3000*(i+1)); continue; }\n                    throw new Error(errStr);\n                }\n                finalUrl = data.data?.[0]?.url; if(!finalUrl) throw new Error('未返回URL');\n                break;\n            } catch (err) {\n                if (i === 3 || !(err.message.includes(\"queue\") || err.message.includes(\"retry\") || err.message.includes(\"429\"))) throw err;\n                await sleep(3000 * (i + 1));\n            }\n        }\n        \n        // Watermark Processing (Optional via admin)\n        finalUrl = await processWatermark(finalUrl);\n\n        S.renderHistory.push(finalUrl);\n        document.getElementById('gallery-count').innerText = `(${S.renderHistory.length})`;\n\n        // Build Result Card Structure (Different for Img2Img to include the slider)\n        if (isImg2Img) {\n            document.getElementById(cardId).outerHTML = `\n                \u003cdiv class=\"res-card group\">\n                    \u003cdiv class=\"compare-wrapper\">\n                        \u003cimg src=\"${finalUrl}\" class=\"compare-img\">\n                        \u003cimg src=\"${S.imgBase}\" class=\"compare-overlay\" id=\"overlay-${cardId}\">\n                        \u003cdiv class=\"compare-handle\" id=\"handle-${cardId}\">\u003c/div>\n                        \u003cinput type=\"range\" min=\"0\" max=\"100\" value=\"50\" class=\"compare-slider\" \n                               oninput=\"\n                                    document.getElementById('overlay-${cardId}').style.clipPath = 'polygon(0 0, ' + this.value + '% 0, ' + this.value + '% 100%, 0 100%)';\n                                    document.getElementById('handle-${cardId}').style.left = this.value + '%';\n                               \">\n                    \u003c/div>\n                    \u003cdiv class=\"rc-ac pointer-events-none group-hover:pointer-events-auto\">\n                        \u003cbutton class=\"btn btn-prim btn-sm\" style=\"flex:1; margin:0\" onclick=\"window.open('${finalUrl}','_blank')\">\u003ci class=\"fa-solid fa-up-right-from-square\">\u003c/i> 查看大图\u003c/button>\n                    \u003c/div>\n                \u003c/div>`;\n        } else {\n            document.getElementById(cardId).outerHTML = `\n                \u003cdiv class=\"res-card group\">\n                    \u003cimg src=\"${finalUrl}\">\n                    \u003cdiv class=\"rc-ac\">\n                        \u003cbutton class=\"btn btn-prim btn-sm\" style=\"flex:1; margin:0\" onclick=\"window.open('${finalUrl}','_blank')\">\u003ci class=\"fa-solid fa-up-right-from-square\">\u003c/i>\u003c/button>\n                    \u003c/div>\n                \u003c/div>`;\n        }\n    } catch(err) {\n        document.getElementById(cardId).outerHTML = `\n            \u003cdiv class=\"res-card p-4 flex-col gap-2 bg-red/10 border-red/30\">\n                \u003ci class=\"fa-solid fa-triangle-exclamation text-red text-2xl\">\u003c/i>\n                \u003cdiv class=\"text-xs text-red text-center line-clamp-3\">${err.message}\u003c/div>\n            \u003c/div>`;\n    } finally {\n        btn.disabled = false; btn.innerHTML = origHtml;\n    }\n}\n\n\n/* --- Video Generation --- */\nasync function startVideoRender() {\n    const config = getApiConfig('video'); if (!config) return;\n    \n    const prompt = document.getElementById('video-prompt').value.trim();\n    if (!prompt) { toast('请输入视频描述', 'warn'); return; }\n    const isImg2Vid = !document.getElementById('video-img-zone').classList.contains('hidden');\n    if (isImg2Vid && !S.vidImg) { toast('图生视频需上传起始图', 'warn'); return; }\n\n    const btn = document.getElementById('video-render-btn');\n    const origHtml = btn.innerHTML;\n    btn.disabled = true; btn.innerHTML = `\u003cdiv class=\"loader loader-white\">\u003c/div> 云端分配中...`;\n\n    const model = document.getElementById('video-engine').value;\n    const sizeStr = document.getElementById('video-size').value;\n    const secs = document.getElementById('video-duration').value;\n    const [tier, ratio] = sizeStr.split(':');\n\n    const cardId = 'vid-' + Date.now();\n    const grid = document.getElementById('res-grid');\n    grid.insertAdjacentHTML('afterbegin', `\n        \u003cdiv id=\"${cardId}\" class=\"res-card p-4 flex-col gap-3\">\n            \u003cdiv class=\"loader\">\u003c/div>\n            \u003cdiv id=\"stat-${cardId}\" class=\"text-xs font-bold text-red tracking-wide text-center\">排队中...\u003c/div>\n        \u003c/div>\n    `);\n\n    try {\n        let payload;\n        if (model === 'agnes-video-v2.0') {\n            const pxMap = { '16:9': { '720P': [1152, 768], '2K': [1920, 1080] }, '9:16': { '720P': [768, 1152], '2K': [1080, 1920] }, '1:1': { '720P': [1024, 1024], '2K': [1440, 1440] } };\n            const fpsMap = { '4': 97, '6': 145, '8': 193, '12': 289 };\n            const [width, height] = (pxMap[ratio] && pxMap[ratio][tier]) ? pxMap[ratio][tier] : [1152, 768];\n            payload = { model: model, prompt: prompt, width: width, height: height, num_frames: fpsMap[secs] || 97, frame_rate: 24 };\n            if (isImg2Vid) payload.image = S.vidImg;\n        } else {\n            payload = { model: model, prompt: prompt, mode: 'text', seconds: String(secs), n: 1, size: tier, aspect_ratio: ratio };\n            if (isImg2Vid) payload.first_frame = S.vidImg;\n        }\n        Object.assign(payload, config.extraParams);\n\n        let tid = null;\n        for (let i = 0; i \u003c= 3; i++) {\n            try {\n                if (i > 0) document.getElementById(`stat-${cardId}`).innerText = `队列拥挤, 第 ${i} 次重试...`;\n                const res = await fetch(`${config.baseUrl}/videos`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` }, body: JSON.stringify(payload) });\n                const data = await res.json();\n                const errorMsg = data.error?.message || data.error || data.msg;\n                if (!res.ok || errorMsg) {\n                    const errStr = String(errorMsg || `HTTP ${res.status}`);\n                    if ((errStr.includes(\"queue\") || errStr.includes(\"retry\") || res.status===429 || res.status===503) && i\u003c3) { await sleep(3000*(i+1)); continue; }\n                    throw new Error(errStr);\n                }\n                tid = data.video_id || data.task_id || data.id; if(!tid) throw new Error('未返回任务ID');\n                break;\n            } catch (err) {\n                if (i === 3 || !(err.message.includes(\"queue\") || err.message.includes(\"retry\") || err.message.includes(\"429\"))) throw err;\n                await sleep(3000 * (i + 1));\n            }\n        }\n        \n        document.getElementById(`stat-${cardId}`).innerHTML = `渲染进行中\u003cbr>\u003cspan class=\"opacity-50 text-[10px] mt-1\">${tid.substring(0,8)}\u003c/span>`;\n        pollVideoRender(config, tid, cardId, model);\n    } catch(err) {\n        document.getElementById(cardId).outerHTML = `\n            \u003cdiv class=\"res-card p-4 flex-col gap-2 bg-red/10 border-red/30\">\n                \u003ci class=\"fa-solid fa-triangle-exclamation text-red text-2xl\">\u003c/i>\n                \u003cdiv class=\"text-xs text-red text-center line-clamp-3\">${err.message}\u003c/div>\n            \u003c/div>`;\n        btn.disabled = false; btn.innerHTML = origHtml;\n    }\n}\n\nfunction pollVideoRender(config, tid, cardId, model) {\n    const isV20 = model === 'agnes-video-v2.0';\n    const qs = isV20 ? `?video_id=${tid}` : `?video_id=${tid}&model_name=${encodeURIComponent(model)}`;\n    const iv = setInterval(async () => {\n        try {\n            const res = await fetch(`${config.baseUrl}/agnesapi${qs}`, { headers: { 'Authorization': `Bearer ${config.apiKey}` } });\n            const data = await res.json();\n            const urlVal = data.url || (data.metadata && data.metadata.url);\n            if (data.status === 'completed' && urlVal) {\n                clearInterval(iv);\n                S.renderHistory.push(urlVal);\n                document.getElementById('gallery-count').innerText = `(${S.renderHistory.length})`;\n                document.getElementById(cardId).outerHTML = `\n                    \u003cdiv class=\"res-card\">\n                        \u003cvideo src=\"${urlVal}\" controls autoplay loop>\u003c/video>\n                        \u003cdiv class=\"rc-ac\">\n                            \u003cbutton class=\"btn btn-prim btn-sm\" style=\"flex:1; margin:0; background:var(--red)\" onclick=\"window.open('${urlVal}','_blank')\">\u003ci class=\"fa-solid fa-download\">\u003c/i>\u003c/button>\n                        \u003c/div>\n                    \u003c/div>`;\n                const btn = document.getElementById('video-render-btn'); btn.disabled = false; btn.innerHTML = `\u003ci class=\"fa-solid fa-film\">\u003c/i> 提交视频渲染`;\n            } else if (data.status === 'failed') { throw new Error(data.error || '云端渲染失败'); }\n        } catch (e) {\n            if(e.message && e.message !== 'Failed to fetch') {\n                clearInterval(iv);\n                document.getElementById(cardId).outerHTML = `\u003cdiv class=\"res-card p-4 flex-col gap-2 bg-red/10 border-red/30\">\u003cdiv class=\"text-xs text-red text-center\">${e.message}\u003c/div>\u003c/div>`;\n                const btn = document.getElementById('video-render-btn'); btn.disabled = false; btn.innerHTML = `\u003ci class=\"fa-solid fa-film\">\u003c/i> 提交视频渲染`;\n            }\n        }\n    }, 4000);\n}\n\n\n/* --- Admin Logic --- */\nfunction initAdminHTML() {\n    const channels = [{id:'chat', n:'对话'}, {id:'image', n:'生图'}, {id:'video', n:'视频'}];\n    const container = document.getElementById('admin-channels-container');\n    channels.forEach(ch => {\n        container.innerHTML += `\n        \u003cdiv id=\"admin-set-${ch.id}\" class=\"space-y-5 hidden bg-white p-6 rounded-2xl border border-slate-200 shadow-sm\">\n            \u003cdiv class=\"flex items-center justify-between mb-4 pb-4 border-b border-slate-100\">\n                \u003ch4 class=\"font-extrabold text-slate-800 text-lg\">${ch.n} 通道独立覆盖配置\u003c/h4>\n                \u003cinput type=\"checkbox\" id=\"admin_${ch.id}_enable\" class=\"w-5 h-5 accent-blue-600 cursor-pointer\" onchange=\"toggleAdminChannel('${ch.id}')\">\n            \u003c/div>\n            \u003cdiv id=\"admin_${ch.id}_wrap\" class=\"opacity-40 pointer-events-none transition-opacity space-y-4\">\n                \u003cdiv>\u003clabel class=\"block text-sm font-bold text-slate-700 mb-2\">独立 API 密钥池\u003c/label>\u003ctextarea id=\"admin_${ch.id}_keys\" rows=\"2\" class=\"w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl\">\u003c/textarea>\u003c/div>\n                \u003cdiv>\u003clabel class=\"block text-sm font-bold text-slate-700 mb-2\">独立 Base URL\u003c/label>\u003cinput type=\"text\" id=\"admin_${ch.id}_url\" class=\"w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl\">\u003c/div>\n                \u003cdiv>\u003clabel class=\"block text-sm font-bold text-slate-700 mb-2\">附加参数 (JSON)\u003c/label>\u003ctextarea id=\"admin_${ch.id}_extra\" rows=\"2\" class=\"w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl\">\u003c/textarea>\u003c/div>\n            \u003c/div>\n        \u003c/div>`;\n    });\n}\n\nlet logoClicks = 0, logoTimer;\nfunction handleLogoClick() {\n    logoClicks++; clearTimeout(logoTimer);\n    if (logoClicks >= 5) { openPasswordModal(); logoClicks = 0; }\n    else { logoTimer = setTimeout(()=>logoClicks=0, 800); }\n}\n\nfunction openPasswordModal() {\n    const m = document.getElementById('passwordModal'); m.classList.remove('hidden');\n    setTimeout(()=>{ m.classList.remove('opacity-0'); document.getElementById('passwordContent').classList.remove('scale-95'); },10);\n}\nfunction closePasswordModal() {\n    const m = document.getElementById('passwordModal'); m.classList.add('opacity-0'); document.getElementById('passwordContent').classList.add('scale-95');\n    setTimeout(()=>m.classList.add('hidden'),300);\n}\nfunction verifyPassword() {\n    if(document.getElementById('adminPasswordInput').value === 'pandas') { closePasswordModal(); setTimeout(()=>openAdmin(),300); }\n    else { toast('密码错误','error'); }\n}\n\nfunction openAdmin() {\n    const m = document.getElementById('adminModal'); m.classList.remove('hidden');\n    loadAdminConfigUI();\n    setTimeout(()=>{ m.classList.remove('opacity-0'); document.getElementById('adminContent').classList.remove('scale-95'); },10);\n}\nfunction closeAdmin() {\n    const m = document.getElementById('adminModal'); m.classList.add('opacity-0'); document.getElementById('adminContent').classList.add('scale-95');\n    setTimeout(()=>m.classList.add('hidden'),300);\n}\n\nfunction switchAdminTab(id) {\n    document.querySelectorAll('[id^=\"tab-admin-\"]').forEach(el => { el.className = 'text-left px-4 py-3 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-100 hover:text-slate-800 whitespace-nowrap transition-colors'; });\n    const activeClass = 'text-left px-4 py-3 rounded-xl font-bold text-sm text-blue-600 bg-blue-50 shadow-sm whitespace-nowrap transition-colors';\n    document.getElementById(`tab-admin-${id}`).className = activeClass;\n    document.querySelectorAll('[id^=\"admin-set-\"]').forEach(el => el.classList.add('hidden'));\n    document.getElementById(`admin-set-${id}`).classList.remove('hidden');\n}\n\nfunction toggleAdminChannel(id) {\n    const chk = document.getElementById(`admin_${id}_enable`).checked;\n    const wrap = document.getElementById(`admin_${id}_wrap`);\n    if(chk) wrap.classList.remove('opacity-40','pointer-events-none'); else wrap.classList.add('opacity-40','pointer-events-none');\n}\nfunction toggleAdminWatermark() {\n    const chk = document.getElementById('admin_wm_enable').checked;\n    const wrap = document.getElementById('admin_wm_wrap');\n    if(chk) wrap.classList.remove('opacity-40','pointer-events-none'); else wrap.classList.add('opacity-40','pointer-events-none');\n}\nfunction toggleWmType() {\n    const isTxt = document.getElementById('admin_wm_type').value === 'text';\n    document.getElementById('wm_text_wrap').classList.toggle('hidden', !isTxt);\n    document.getElementById('wm_image_wrap').classList.toggle('hidden', isTxt);\n}\nfunction handleWmImageUpload(input) {\n    if(input.files[0]) {\n        const r = new FileReader(); r.onload = e => {\n            document.getElementById('admin_wm_image_base64').value = e.target.result;\n            const p = document.getElementById('admin_wm_image_preview'); p.src = e.target.result; p.classList.remove('hidden');\n        }; r.readAsDataURL(input.files[0]);\n    }\n}\n\nfunction collectAdminConfig() {\n    const cfg = {\n        global: { keys: document.getElementById('admin_global_keys').value.split('\\n').map(k=>k.trim()).filter(k=>k), url: document.getElementById('admin_global_url').value, extra: document.getElementById('admin_global_extra').value },\n        watermark: { enable: document.getElementById('admin_wm_enable').checked, type: document.getElementById('admin_wm_type').value, text: document.getElementById('admin_wm_text').value, image: document.getElementById('admin_wm_image_base64').value, position: document.getElementById('admin_wm_position').value }\n    };\n    ['chat','image','video'].forEach(c => {\n        cfg[c] = { enable: document.getElementById(`admin_${c}_enable`).checked, keys: document.getElementById(`admin_${c}_keys`).value.split('\\n').map(k=>k.trim()).filter(k=>k), url: document.getElementById(`admin_${c}_url`).value, extra: document.getElementById(`admin_${c}_extra`).value };\n    });\n    return cfg;\n}\n\nfunction loadAdminConfigUI() {\n    const cfg = getSysConfig(); if(!cfg) return;\n    try {\n        if(cfg.global) { document.getElementById('admin_global_keys').value = cfg.global.keys.join('\\n'); document.getElementById('admin_global_url').value = cfg.global.url; document.getElementById('admin_global_extra').value = cfg.global.extra; }\n        if(cfg.watermark) { document.getElementById('admin_wm_enable').checked = !!cfg.watermark.enable; document.getElementById('admin_wm_type').value = cfg.watermark.type || 'text'; document.getElementById('admin_wm_text').value = cfg.watermark.text || ''; document.getElementById('admin_wm_position').value = cfg.watermark.position || 'bottom-right'; if(cfg.watermark.image){ document.getElementById('admin_wm_image_base64').value = cfg.watermark.image; const p = document.getElementById('admin_wm_image_preview'); p.src = cfg.watermark.image; p.classList.remove('hidden'); } toggleAdminWatermark(); toggleWmType(); }\n        ['chat','image','video'].forEach(c => { if(cfg[c]) { document.getElementById(`admin_${c}_enable`).checked = !!cfg[c].enable; document.getElementById(`admin_${c}_keys`).value = cfg[c].keys.join('\\n'); document.getElementById(`admin_${c}_url`).value = cfg[c].url; document.getElementById(`admin_${c}_extra`).value = cfg[c].extra; toggleAdminChannel(c); }});\n    }catch(e){}\n}\nfunction saveAdminLocally() {\n    localStorage.setItem('pandas_admin_config', JSON.stringify(collectAdminConfig())); toast('配置已保存到本地浏览器', 'ok'); closeAdmin();\n}\n\nasync function processWatermark(originalUrl) {\n    const sys = getSysConfig(); const wm = sys?.watermark?.enable ? sys.watermark : null;\n    if (!wm) return originalUrl;\n    return new Promise(async (resolve) => {\n        try {\n            const res = await fetch(originalUrl); const blob = await res.blob(); const blobUrl = URL.createObjectURL(blob);\n            const img = new Image(); img.onload = () => {\n                const canvas = document.createElement('canvas'); canvas.width = img.width; canvas.height = img.height;\n                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0);\n                const pad = Math.max(20, canvas.width * 0.03);\n                const draw = (wImg = null) => {\n                    ctx.globalAlpha = 0.85; let w = 0, h = 0;\n                    if (wm.type === 'text' && wm.text) {\n                        const fSize = Math.max(20, canvas.width * 0.035);\n                        ctx.font = `bold ${fSize}px sans-serif`; ctx.fillStyle = \"rgba(255, 255, 255, 0.9)\";\n                        ctx.shadowColor = \"rgba(0,0,0,0.6)\"; ctx.shadowBlur = 8;\n                        w = ctx.measureText(wm.text).width; h = fSize;\n                    } else if (wImg) {\n                        const scale = (canvas.width * 0.15) / wImg.width; w = wImg.width * scale; h = wImg.height * scale;\n                    }\n                    let x = pad, y = pad + h;\n                    if (wm.position === 'top-right') { x = canvas.width - w - pad; }\n                    else if (wm.position === 'bottom-left') { y = canvas.height - pad; }\n                    else if (wm.position === 'bottom-right') { x = canvas.width - w - pad; y = canvas.height - pad; }\n                    else if (wm.position === 'center') { x = (canvas.width - w) / 2; y = (canvas.height + h) / 2; }\n                    if (wm.type === 'text' && wm.text) ctx.fillText(wm.text, x, y);\n                    else if (wImg) { y -= h; ctx.drawImage(wImg, x, y, w, h); }\n                    canvas.toBlob((outBlob) => { resolve(URL.createObjectURL(outBlob)); URL.revokeObjectURL(blobUrl); }, 'image/jpeg', 0.95);\n                };\n                if (wm.type === 'image' && wm.image) { const i = new Image(); i.onload = () => draw(i); i.src = wm.image; } else draw();\n            }; img.onerror = () => resolve(originalUrl); img.src = blobUrl;\n        } catch(e){ resolve(originalUrl); }\n    });\n}\n\nfunction clearResults() { document.getElementById('res-grid').innerHTML = ''; S.renderHistory = []; document.getElementById('gallery-count').innerText=''; }\n\nfunction toast(msg, type='info') {\n  const container = document.getElementById('toast');\n  const item = document.createElement('div');\n  item.className = 'toast ' + type;\n  const icons = {ok:'fa-circle-check text-green', info:'fa-info-circle text-blue', warn:'fa-triangle-exclamation text-yellow', error:'fa-circle-xmark text-red'};\n  item.innerHTML = `\u003ci class=\"fa-solid ${icons[type]} text-lg\">\u003c/i> \u003cspan>${msg}\u003c/span>`;\n  container.appendChild(item);\n  setTimeout(() => { item.style.opacity = '0'; item.style.transform = 'translateX(20px)'; item.style.transition = 'all .3s'; setTimeout(() => item.remove(), 300); }, 3000);\n}\n\u003c/script>\n\u003cscript>\n/* pandas AI 生成图片自动收集桥（跨 iframe postMessage 推送给宿主） */\n(function () {\n  if (window.__pandasAIGenBridge) return; window.__pandasAIGenBridge = true;\n  var seen = [], lastRef = null, timer = null;\n  function detectSource() {\n    try { if (typeof S !== 'undefined' && S && S.mode) return String(S.mode); } catch (e) {}\n    return 'unknown';\n  }\n  function scan() {\n    try {\n      var h = (typeof S !== 'undefined' && S) ? S.renderHistory : null;\n      if (!h || !Array.isArray(h) || !h.length) return;\n      if (h !== lastRef) { lastRef = h; seen.length = 0; }\n      if (h.length === seen.length) return;\n      var now = Date.now();\n      for (var i = seen.length; i \u003c h.length; i++) {\n        var u = h[i];\n        if (!u) continue;\n        var su = String(u);\n        if (seen.indexOf(su) !== -1) continue;\n        seen.push(su);\n        try {\n          parent.postMessage({ type: 'pandas_ai_gen_image', url: su, time: now, source: detectSource() }, '*');\n        } catch (e) {}\n      }\n    } catch (e) {}\n  }\n  timer = setInterval(scan, 900);\n  if (document.readyState !== 'loading') scan();\n  document.addEventListener('DOMContentLoaded', scan);\n})();\n\u003c/script>\n\u003c!-- \u003cscript>\n\n/* ===================================================================== */\n/* pandas AI 工作台 · 设备级响应式动态 UI (注入块)                           */\n/* 仅在 \u003c768 / 768-1023 生效；动态注入画布顶栏折叠按钮、模式抽屉头、        */\n/* 底部导航、遮罩；不触碰原有 React/原生逻辑，仅切换 class 与 focus。      */\n/* ===================================================================== */\n(function() {\n  var doc = document, win = window;\n  var CFG_TITLES = { chat:'AI 对话', ai:'专业生图', style:'图生图（风格迁移）', manual:'手动摄影生图', video:'AI 视频生成' };\n\n  function isPda() {\n    var w = win.innerWidth || doc.documentElement.clientWidth;\n    if (w \u003c 768) return 'm';\n    if (w \u003c= 1023) return 't';\n    return 'd';\n  }\n  function apply() {\n    var k = isPda();\n    var h = doc.documentElement;\n    h.classList.remove('pda-m', 'pda-t');\n    if (k === 'm') h.classList.add('pda-m');\n    else if (k === 't') h.classList.add('pda-t');\n    // 切到桌面自动收拢所有抽屉\n    if (k === 'd') closeAll();\n  }\n  function closeAll() {\n    var cfg = doc.getElementById('cfg');\n    var mb = doc.getElementById('mode-bar');\n    if (cfg) cfg.classList.remove('pda-open');\n    if (mb) mb.classList.remove('pda-open');\n    var bd = doc.getElementById('pdaBackdrop');\n    if (bd) bd.classList.remove('pda-show');\n  }\n  function closeBackdrop() { var bd = doc.getElementById('pdaBackdrop'); if (bd) bd.classList.remove('pda-show'); }\n\n  function ensureUI() {\n    if (doc.getElementById('pdaTabbar')) return;          // 已构建\n    if (!doc.getElementById('canvas-top')) return;        // 保守守卫（正常必有 #canvas-top）\n    var root = doc.body || doc.documentElement;\n\n    /* 遮罩层 */\n    var bd = doc.createElement('div'); bd.id = 'pdaBackdrop';\n    bd.addEventListener('click', closeAll);\n    /* 模式抽屉头部（含 LOGO + 后台入口 + 关闭） */\n    var mh = doc.createElement('div'); mh.id = 'pdaModeHead';\n    mh.innerHTML = '\u003cdiv class=\"logo-icon\" title=\"持续点击5次进入管理后台\" style=\"font-size:11px;letter-spacing:0px;cursor:pointer\">\u003ci class=\"fa-solid fa-sliders\">\u003c/i>\u003c/div>' +\n                   '\u003cdiv id=\"pdaModeCfgTip\" style=\"flex:1;font-size:12px;font-weight:700;color:var(--text2)\">切换模式\u003c/div>' +\n                   '\u003ci id=\"pdaModeClose\" class=\"fa-solid fa-xmark\" style=\"font-size:18px;color:var(--text3);padding:6px;cursor:pointer\">\u003c/i>';\n    /* 模式抽屉内容由原有 #mode-bar 承载（class 控制），头部追加到其首 */\n    var mb = doc.getElementById('mode-bar');\n    if (mb) mb.insertBefore(mh, mb.firstChild);\n\n    /* 底部导航 */\n    var tb = doc.createElement('div'); tb.id = 'pdaTabbar';\n    tb.innerHTML =\n      '\u003cbutton id=\"pdaTabMode\" data-g=\"mode\">\u003ci class=\"fa-solid fa-bars-staggered\">\u003c/i>\u003cspan>模式\u003c/span>\u003c/button>' +\n      '\u003cbutton id=\"pdaTabCfg\" data-g=\"cfg\">\u003ci class=\"fa-solid fa-sliders\">\u003c/i>\u003cspan>配置\u003c/span>\u003c/button>' +\n      '\u003cbutton id=\"pdaTabGallery\" data-g=\"gallery\">\u003ci class=\"fa-solid fa-images\">\u003c/i>\u003cspan>画廊\u003c/span>\u003c/button>' +\n      '\u003cbutton id=\"pdaTabClear\" data-g=\"clear\" class=\"danger\">\u003ci class=\"fa-regular fa-trash-can\">\u003c/i>\u003cspan>清空\u003c/span>\u003c/button>';\n\n    root.appendChild(bd);\n    root.appendChild(tb);\n\n    /* 画布顶栏折叠按钮（汉堡=模式 / 齿轮=配置），动态注入到 #canvas-top */\n    var ct = doc.getElementById('canvas-top');\n    if (ct) {\n      var hb = doc.createElement('button'); hb.id = 'pdaBtnMenu'; hb.setAttribute('aria-label', '菜单');\n      hb.innerHTML = '\u003ci class=\"fa-solid fa-bars\">\u003c/i>';\n      var ge = doc.createElement('button'); ge.id = 'pdaBtn-cfg'; ge.innerHTML = '\u003ci class=\"fa-solid fa-sliders\">\u003c/i> 配置';\n      ct.insertBefore(hb, ct.firstChild);\n      ct.appendChild(ge);\n    }\n\n    /* 事件 */\n    var onMode = doc.getElementById('pdaBtnMenu');\n    var onCfg = doc.getElementById('pdaBtn-cfg');\n    var tabMode = doc.getElementById('pdaTabMode');\n    var tabCfg = doc.getElementById('pdaTabCfg');\n    var tabClear = doc.getElementById('pdaTabClear');\n    /* 配置抽屉头部追加关闭按钮 */\n    var cfgHead = doc.getElementById('cfg-head');\n    var cfgClose = null;\n    if (cfgHead) {\n      cfgClose = doc.createElement('i'); cfgClose.id = 'pdaCfgClose';\n      cfgClose.className = 'fa-solid fa-xmark';\n      cfgClose.style.cssText = 'font-size:18px;color:var(--text3);padding:6px;cursor:pointer';\n      cfgHead.appendChild(cfgClose);\n    }\n    var modeClose = doc.getElementById('pdaModeClose');\n    function toggleMode() {\n      if (mb) mb.classList.toggle('pda-open');\n      var open = mb && mb.classList.contains('pda-open');\n      if (open) { closeCfgDrawer(); showBackdrop(); }\n      else closeBackdrop();\n    }\n    function toggleCfg() {\n      var cfg = doc.getElementById('cfg');\n      if (cfg) cfg.classList.toggle('pda-open');\n      var open = cfg && cfg.classList.contains('pda-open');\n      if (open) { closeModeDrawer(); showBackdrop(); }\n      else closeBackdrop();\n    }\n    function closeModeDrawer(){ if(mb) mb.classList.remove('pda-open'); }\n    function closeCfgDrawer(){ var cfg=doc.getElementById('cfg'); if(cfg) cfg.classList.remove('pda-open'); }\n    function showBackdrop(){ bd.classList.add('pda-show'); }\n    function switchModeSafe(m) {\n      if (typeof win.switchMode === 'function') { try { win.switchMode(m); } catch(e){} }\n      var ct2 = doc.getElementById('cfg-title'); if (ct2 && CFG_TITLES[m]) ct2.textContent = CFG_TITLES[m];\n      closeModeDrawer(); closeBackdrop();\n    }\n    if (onMode) onMode.addEventListener('click', toggleMode);\n    if (onCfg) onCfg.addEventListener('click', toggleCfg);\n    if (cfgClose) cfgClose.addEventListener('click', function(){ closeCfgDrawer(); closeBackdrop(); });\n    if (modeClose) modeClose.addEventListener('click', function(){ closeModeDrawer(); closeBackdrop(); });\n    if (tabMode) tabMode.addEventListener('click', toggleMode);\n    if (tabCfg) tabCfg.addEventListener('click', toggleCfg);\n    if (tabClear && typeof win.clearResults === 'function') {\n      tabClear.addEventListener('click', function(){ try { win.clearResults(); } catch(e){} });\n    }\n    /* 画廊移到顶部并收起面板 */\n    var tabGallery = doc.getElementById('pdaTabGallery');\n    if (tabGallery) tabGallery.addEventListener('click', function(){\n      closeAll(); \n      var ra = doc.getElementById('result-area') || doc.getElementById('res-grid');\n      if (ra) { try { ra.scrollIntoView({ behavior:'smooth', block:'start' }); } catch(e){ ra.scrollIntoView(); } }\n    });\n    /* 底部 tab 状态切换 */\n    var tabs = [tabMode, tabCfg, tabGallery].filter(Boolean);\n    tb.addEventListener('click', function(e){\n      tb.querySelectorAll('button').forEach(function(b){ b.classList.remove('on'); });\n      var t = e.target.closest ? e.target.closest('button') : null;\n      if (t) t.classList.add('on');\n    });\n    doc.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeAll(); } });\n  }\n\n  /* 等待原有 DOM 就绪 */\n  function boot() {\n    if (doc.body && doc.getElementById('mode-bar') && doc.getElementById('cfg')) {\n      ensureUI(); apply();\n    } else if (doc.readyState === 'loading') {\n      doc.addEventListener('DOMContentLoaded', boot);\n    } else {\n      setTimeout(boot, 80);\n    }\n  }\n  win.addEventListener('resize', apply);\n  boot();\n})();\n\n\u003c/script> -->\n\n\u003c!-- 站长后台可编辑文本/图片注入（AI 生图页面 可视化编辑） -->\n\u003cscript id=\"pandas-ai-site-text\">\n(function(){\n  function esc(s){ return s==null?'':String(s); }\n  function setT(id,v){ var el=document.getElementById(id); if(el&&v) el.textContent=esc(v); }\n  var t={};\n  try{ t=(window.APP_ENV&&window.APP_ENV.siteText)||{}; }catch(e){}\n  if(t.siteTitle) document.title=esc(t.siteTitle);\n  setT('aiSiteBrand',t.brand);\n  setT('aiSiteHeadline',t.headline);\n  setT('aiSiteSubtitle',t.subtitle);\n  setT('aiSiteBadge',t.badge);\n  setT('aiSiteModeChat',t.modeChat);\n  setT('aiSiteModeAi',t.modeAi);\n  setT('aiSiteModeStyle',t.modeStyle);\n  setT('aiSiteModeManual',t.modeManual);\n  setT('aiSiteModeVideo',t.modeVideo);\n  setT('aiShowcaseTitle',t.showcaseTitle);\n  var g=(t.gallery||[]).filter(function(it){ return it&&it.url; });\n  setT('aiShowcaseSub', t.showcaseSub || (g.length?('站长精选 · 共 '+g.length+' 幅'):''));\n  var wrap=document.getElementById('ai-showcase-grid');\n  var sec=document.getElementById('ai-showcase');\n  if(wrap&&g.length){\n    var h='';\n    g.forEach(function(it){\n      h+='\u003cdiv class=\"res-card\" style=\"aspect-ratio:auto;height:auto;overflow:hidden\">'\n        +'\u003cimg src=\"'+esc(it.url)+'\" alt=\"'+esc(it.name||'')+'\" loading=\"lazy\" referrerpolicy=\"no-referrer\" style=\"width:100%;height:auto;display:block;aspect-ratio:1/1;object-fit:cover\">'\n        +'\u003cdiv class=\"rc-ac\" style=\"opacity:1;padding:14px 12px\">'\n        +'\u003cdiv style=\"font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)\">'+esc(it.name||'')+'\u003c/div>'\n        +(it.caption?'\u003cdiv style=\"font-size:11px;color:rgba(255,255,255,.85);margin-top:3px;text-shadow:0 1px 2px rgba(0,0,0,.45)\">'+esc(it.caption)+'\u003c/div>':'')\n        +'\u003c/div>\u003c/div>';\n    });\n    wrap.innerHTML=h;\n    sec.classList.remove('hidden');\n  }\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>";

        // ======================================================================

        // --- 免费机器翻译引擎 ---
        const translateToEn = async (text) => {
            if (!text || !text.trim()) return text;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(item => item[0]).join('');
            } catch (err) {
                console.error("Translation failed:", err);
                return text;
            }
        };

        const autoTranslateField = async (value, onEditCallback) => {
            if (!window.__autoTranslateEnabled || window.__currentLang !== 'cn' || !value) return;
            if (window.__showToast) window.__showToast("🔄 机器翻译同步中...");
            const translated = await translateToEn(value);
            onEditCallback(translated);
            if (window.__showToast) {
                window.__showToast("✅ 英文版已同步");
                setTimeout(() => window.__showToast(''), 2000);
            }
        };

        // --- 智能解析视频链接 (支持 B站、YouTube 及通用 iframe 代码) ---
        const parseVideoUrl = (url) => {
            if (!url) return { isIframe: false, url: '' };
            let parsedUrl = String(url).trim();

            const iframeMatch = parsedUrl.match(/<iframe.*?src=["'](.*?)["']/i);
            if (iframeMatch) {
                parsedUrl = iframeMatch[1];
            }

            // 智能识别 B站 BV 号 (支持直接填BV号、短链接 b23.tv 或 完整链接)
            const bvMatch = parsedUrl.match(/(BV[1-9A-HJ-NP-Za-km-z]{10})/i);
            if (bvMatch) {
                // 统一转换为 B 站官方 iframe 播放器地址
                parsedUrl = `https://player.bilibili.com/player.html?bvid=${bvMatch[1]}&page=1&high_quality=1&as_wide=1&allowfullscreen=true&autoplay=0`;
            }

            if (parsedUrl.includes('player.bilibili.com') || 
                parsedUrl.includes('youtube.com/embed') || 
                parsedUrl.includes('v.qq.com/txp/iframe')) {
                
                if (parsedUrl.startsWith('//')) {
                    parsedUrl = 'https:' + parsedUrl;
                }
                return { isIframe: true, url: parsedUrl };
            }

            return { isIframe: false, url: parsedUrl };
        };

        const ParticlesBackground = ({ color }) => {
          const canvasRef = useRef(null);
          useEffect(() => {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            let animationFrameId;
            let particles = [];
            const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize); resize();
            
            class Particle {
              constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
              }
              update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.005;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
              }
              draw() {
                ctx.fillStyle = color || 'rgba(0,0,0,0.1)';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
              }
            }
            for(let i=0; i<80; i++) particles.push(new Particle());
            
            const animate = () => {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              particles.forEach(p => { p.update(); p.draw(); });
              animationFrameId = requestAnimationFrame(animate);
            };
            animate();
            return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(animationFrameId); };
          }, [color]);
          return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-[-1] opacity-60"></canvas>;
        };

        // --- 纯图片 360° VR 全景渲染引擎封装 ---
        const Image360Viewer = ({ image }) => {
            const containerRef = useRef(null);
            const viewerRef = useRef(null);

            useEffect(() => {
                if (window.pannellum && image && containerRef.current) {
                    if (viewerRef.current) {
                        try { viewerRef.current.destroy(); } catch (e) {}
                    }
                    try {
                        viewerRef.current = window.pannellum.viewer(containerRef.current, {
                            type: 'equirectangular',
                            panorama: image,
                            autoLoad: true,
                            showControls: true,
                            mouseZoom: true,
                            keyboardZoom: false
                        });
                    } catch (e) {
                        console.error("Pannellum Init Error", e);
                    }
                }
                return () => {
                    if (viewerRef.current) {
                        try { viewerRef.current.destroy(); } catch (e) {}
                    }
                };
            }, [image]);

            return <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing"></div>;
        };

        const getMergedStyles = (data, fieldKey) => {
          const cStyle = data.customStyles?.[fieldKey] || {};
          const isGrad = cStyle.isGradient;
          return {
            fontSize: cStyle.fontSize || undefined,
            fontFamily: cStyle.fontFamily || undefined,
            ...(isGrad
              ? { backgroundImage: cStyle.color || 'linear-gradient(to right, #bf953f, #fcf6ba)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', color: 'transparent' }
              : { color: cStyle.color || undefined, WebkitTextFillColor: 'initial', backgroundImage: 'none' })
          };
        };

        // --- 主页内嵌视频控制器组件 ---
        const HeroVideoPlayer = ({ src, objectFit, loop, onEnded, lang }) => {
            const parsed = parseVideoUrl(src);
            const videoRef = useRef(null);
            const [isPlaying, setIsPlaying] = useState(true);
            const [progress, setProgress] = useState(0);
            const [isMuted, setIsMuted] = useState(false); // 默认尝试带声音播放

            useEffect(() => {
                if (videoRef.current && !parsed.isIframe) {
                    if (src) {
                        videoRef.current.muted = isMuted;
                        const playPromise = videoRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => setIsPlaying(true)).catch((e) => {
                                // 现代浏览器策略限制：若带声音自动播放被拦截，则降级为静音自动播放
                                console.log("Auto-play with sound blocked by browser, falling back to muted auto-play.");
                                setIsMuted(true);
                                if (videoRef.current) {
                                    videoRef.current.muted = true;
                                    videoRef.current.play().then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
                                }
                            });
                        }
                    } else {
                        setIsPlaying(false);
                    }
                }
            }, [src, parsed.isIframe]);

            const handleTimeUpdate = () => {
                if (videoRef.current) {
                    const p = (videoRef.current.currentTime / videoRef.current.duration) * 100;
                    setProgress(p || 0);
                }
            };

            const togglePlay = (e) => {
                e.stopPropagation();
                if (videoRef.current) {
                    if (videoRef.current.paused) {
                        const playPromise = videoRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => setIsPlaying(true)).catch(() => setIsPlaying(false));
                        }
                    } else {
                        videoRef.current.pause();
                        setIsPlaying(false);
                    }
                }
            };

            const stopVideo = (e) => {
                e.stopPropagation();
                if (videoRef.current) {
                    videoRef.current.pause();
                    videoRef.current.currentTime = 0;
                    setIsPlaying(false);
                }
            };

            const toggleFullscreen = (e) => {
                e.stopPropagation();
                if (videoRef.current) {
                    if (videoRef.current.requestFullscreen) {
                        videoRef.current.requestFullscreen();
                    } else if (videoRef.current.webkitRequestFullscreen) {
                        videoRef.current.webkitRequestFullscreen();
                    }
                }
            };

            const handleSeek = (e) => {
                e.stopPropagation();
                const val = e.target.value;
                if (videoRef.current && videoRef.current.duration) {
                    videoRef.current.currentTime = (val / 100) * videoRef.current.duration;
                    setProgress(val);
                }
            };

            const toggleMute = (e) => {
                e.stopPropagation();
                const nextMuted = !isMuted;
                setIsMuted(nextMuted);
                if (videoRef.current) {
                    videoRef.current.muted = nextMuted;
                }
            };

            if (parsed.isIframe) {
                let iframeSrc = parsed.url;
                if (iframeSrc.includes('bilibili')) {
                    // 开启自动播放，关闭弹幕，去除所有强制静音参数以允许声音输出
                    if (iframeSrc.includes('autoplay=')) iframeSrc = iframeSrc.replace(/autoplay=\d+/, 'autoplay=1');
                    else iframeSrc += (iframeSrc.includes('?') ? '&' : '?') + 'autoplay=1';
                    if (!iframeSrc.includes('danmaku=')) iframeSrc += '&danmaku=0';
                }
                return (
                    <div className="relative w-full h-full group bg-black flex items-center justify-center">
                        {/* 完全移除透明遮罩和尺寸超放，恢复 B 站原生控制条的可点击性 */}
                        <iframe 
                            src={iframeSrc} 
                            className="w-full h-full border-0" 
                            allow="autoplay; fullscreen; encrypted-media"
                        ></iframe>
                    </div>
                );
            }

            return (
                <div className="relative w-full h-full group bg-black">
                    <video 
                        ref={videoRef} 
                        src={src} 
                        className={`w-full h-full object-${objectFit} transition-opacity duration-1000`} 
                        autoPlay playsInline loop={loop} 
                        muted={isMuted}
                        draggable={false}
                        onContextMenu={(e)=>{e.preventDefault();}}
                        onEnded={onEnded}
                        onTimeUpdate={handleTimeUpdate}
                        onClick={togglePlay}
                    ></video>
                    
                    {/* 静音降级时的醒目开启音乐按钮 */}
                    {isMuted && (
                        <button onClick={toggleMute} className="absolute top-6 right-6 md:top-10 md:right-10 bg-black/40 hover:bg-black/70 backdrop-blur text-white px-4 py-2.5 rounded-full flex items-center gap-2 transition-all z-30 pointer-events-auto border border-white/20 shadow-lg animate-pulse">
                            <i className="ri-volume-mute-fill text-lg"></i>
                            <span className="text-xs tracking-widest font-bold">{lang === 'en' ? 'Tap to unmute' : '点击开启音乐'}</span>
                        </button>
                    )}

                    {/* Hover 控制器遮罩 */}
                    <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/70 to-transparent pt-12 pb-4 px-6 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none flex flex-col justify-end z-20">
                        <div className="flex items-center gap-4 w-full max-w-5xl mx-auto pointer-events-auto">
                            <button onClick={togglePlay} className="text-white hover:text-blue-400 transition" title={isPlaying ? (lang === 'en' ? "Pause" : "暂停") : (lang === 'en' ? "Play" : "播放")}>
                                <i className={isPlaying ? "ri-pause-fill text-2xl" : "ri-play-fill text-2xl"}></i>
                            </button>
                            <button onClick={stopVideo} className="text-white hover:text-blue-400 transition" title={lang === 'en' ? "Stop" : "停止"}>
                                <i className="ri-stop-fill text-2xl"></i>
                            </button>
                            
                            <input 
                                type="range" min="0" max="100" value={progress} onChange={handleSeek} 
                                className="flex-1 h-1.5 bg-white/30 rounded-lg appearance-none cursor-pointer 
                                           [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 
                                           [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:bg-white 
                                           [&::-webkit-slider-thumb]:rounded-full hover:[&::-webkit-slider-thumb]:scale-125 transition-all" 
                            />

                            <button onClick={toggleMute} className="text-white hover:text-blue-400 transition" title={isMuted ? (lang === 'en' ? "Unmute" : "开启声音") : (lang === 'en' ? "Mute" : "静音")}>
                                <i className={isMuted ? "ri-volume-mute-fill text-2xl" : "ri-volume-up-fill text-2xl"}></i>
                            </button>
                            
                            <button onClick={toggleFullscreen} className="text-white hover:text-blue-400 transition" title={lang === 'en' ? "Fullscreen" : "全屏"}>
                                <i className="ri-fullscreen-line text-2xl"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const EditableText = ({ data, field, lang = 'cn', tag: Tag = 'div', className, isEditing, onEdit, onFocus, isUiText = false, source = '' }) => {
          const actualField = (lang === 'en' && !['langCn','langEn','footerIcp'].includes(field)) ? (field + 'En') : field;
          const mergedStyle = getMergedStyles(data, actualField);

        const VideoFullscreenPlayer = ({ parsed, iframeSrc, onClose }) => {
            const stageRef = React.useRef(null);
            React.useEffect(() => {
                const stage = stageRef.current;
                if (!stage) return;
                let entered = false;   // 是否真正进入过全屏，用于区分"ESC退出"与"全屏申请失败"
                const tryFull = () => {
                    try {
                        if (stage.requestFullscreen) {
                            stage.requestFullscreen().then(() => { entered = true; }).catch(() => {});
                        } else if (stage.webkitRequestFullscreen) {
                            stage.webkitRequestFullscreen();
                            entered = true;
                        }
                    } catch (e) { /* 忽略，退化为弹窗播放 */ }
                };
                const fsTimer = setTimeout(tryFull, 80); // 保持在用户点击激活窗口内
                const onFsChange = () => {
                    const hasFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                    if (entered && !hasFs) onClose();
                };
                document.addEventListener('fullscreenchange', onFsChange);
                document.addEventListener('webkitfullscreenchange', onFsChange);
                const onKey = (e) => { if (e.key === 'Escape') onClose(); };
                document.addEventListener('keydown', onKey);
                return () => {
                    clearTimeout(fsTimer);
                    document.removeEventListener('fullscreenchange', onFsChange);
                    document.removeEventListener('webkitfullscreenchange', onFsChange);
                    document.removeEventListener('keydown', onKey);
                };
            }, []);

            const closeAll = () => {
                try {
                    if (document.fullscreenElement) document.exitFullscreen();
                    else if (document.webkitFullscreenElement) document.webkitFullscreenElement();
                } catch (e) {}
                onClose();
            };
            const blockCtx = (e) => { try { e.preventDefault(); } catch (err) {} };

            return (
                <div ref={stageRef} className="fixed inset-0 z-[100] bg-black flex items-center justify-center animate-fade-in" onClick={closeAll}>
                    <button onClick={(e)=>{e.stopPropagation(); closeAll();}} className="absolute top-6 right-6 md:top-8 md:right-8 text-white/70 hover:text-white z-10 bg-white/10 hover:bg-white/20 p-2 rounded-full backdrop-blur-md transition-all cursor-pointer"><i className="ri-close-line text-2xl"></i></button>
                    <div className="w-full h-full flex items-center justify-center px-4 relative">
                        {parsed.isIframe ? (
                            <iframe src={iframeSrc} className="w-full h-full border-0 bg-black" allowFullScreen allow="autoplay; fullscreen; encrypted-media" onContextMenu={blockCtx}></iframe>
                        ) : (
                            <video src={parsed.url} controls autoPlay playsInline
                                className="w-full h-full object-contain bg-black"
                                controlsList="nodownload noremoteplayback noplaybackrate"
                                disablePictureInPicture
                                draggable={false}
                                onContextMenu={blockCtx}
                                onClick={(e)=>e.stopPropagation()}
                            ></video>
                        )}
                    </div>
                </div>
            );
        };

          const ensureEnFields = async (root) => {
              if (!window.__autoTranslateEnabled) return;
              if (ensureEnFields.busy) return;

              try {
                  const zhRe = /[\u4e00-\u9fff]/;
                  const skipKeys = new Set(['id','url','vid','img','icon','link','qr','date','src','poster','srcDoc','time','iconUrl']);
                  const cache = new Map();
                  const walk = async (node) => {
                      if (!node || typeof node !== 'object') return;
                      if (Array.isArray(node)) { for (const it of node) await walk(it); return; }
                      const tasks = [];
                      for (const k of Object.keys(node)) {
                          const v = node[k];
                          if (typeof v === 'string') {
                              if (k.endsWith('En') || skipKeys.has(k) || !zhRe.test(v) || (k + 'En') in node) continue;

                                  let t = cache.get(v);
                                  if (!t) { t = await translateToEn(v); cache.set(v, t); }
                                  if (t && t !== v) node[k + 'En'] = t;
                              })());
                          } else if (v && typeof v === 'object') {
                              tasks.push(walk(v));
                          }
                      }
                      for (let i = 0; i < tasks.length; i += 6) {
                          await Promise.all(tasks.slice(i, i + 6));
                      }
                  };
                  await walk(root);

                                   className={`${isMasonry ? 'masonry-item rounded-sm bg-[#fcfaf8] border border-aman-border/50 p-0' : `flex flex-col ${getGridSpanClass(item.cardSize)}`} group cursor-pointer relative shadow-sm hover:shadow-md transition-all duration-300`}
